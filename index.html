<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qurbandong Odot</title>
<meta name="theme-color" content="#1d4a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QDF Odot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/pt-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pc-800.woff2" as="font" type="font/woff2" crossorigin>
<script src="config.js?v=4"></script>
</head>
<body>
<title>Qurbandong Odot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D4715">
<style>
@font-face{font-family:'Paralucent Text';src:url('fonts/pt-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Paralucent Text';src:url('fonts/pt-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Paralucent Text';src:url('fonts/pt-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Paralucent Text';src:url('fonts/pt-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Paralucent Cond';src:url('fonts/pc-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Paralucent Cond';src:url('fonts/pc-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Paralucent Cond';src:url('fonts/pc-800.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
:root{
  --brand:#0D4715; --brand-2:#41644A; --brand-ink:#FFE5C8;
  --bg:#FFF6EC; --surface:#FFFDFA; --surface-2:#FCEBD7; --ink:#2A2D2B; --ink-2:#535855; --ink-3:#7C847F; --line:#F0DCC5;
  --hero:#0D4715; --hero-ink:#FFF5E9; --hero-2:#ABC8B2; --hero-track:rgba(255,229,200,.18);
  --accent:#E9762B; --accent-soft:#FFE5C8; --accent-ink:#964510;
  --link:#41644A;
  --pos:#1D7A2B; --neg:#B8321F; --warn:#A35400; --info:#3B6A8F;
  --pos-soft:#E1EEE3; --neg-soft:#F9DED7; --warn-soft:#FCE3C4; --info-soft:#DEE8F0;
  --c-in:#41644A; --c-out:#E9762B; --c-line:#0D4715; --c-target:#F8D6B0;
  --scrim:rgba(20,22,21,.5);
  --shadow:0 1px 2px rgba(42,45,43,.05),0 8px 24px rgba(150,69,16,.07);
  --f-display:'Paralucent Cond','Arial Narrow',system-ui,sans-serif;
  --f-body:'Paralucent Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --nav-h:66px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#0D4715; --brand-2:#81AD8C; --brand-ink:#FFE5C8;
  --bg:#1B1D1C; --surface:#2A2D2B; --surface-2:#343835; --ink:#FFF1E2; --ink-2:#C9C3BA; --ink-3:#8F948F; --line:#3D413E;
  --hero:#0D4715; --hero-ink:#FFF1E2; --hero-2:#ABC8B2; --hero-track:rgba(255,229,200,.14);
  --accent:#ED9255; --accent-soft:#40291A; --accent-ink:#F6C8AA;
  --link:#ED9255;
  --pos:#81AD8C; --neg:#EF7F6C; --warn:#F2AD80; --info:#8AB6D6;
  --pos-soft:#1F3325; --neg-soft:#3D221D; --warn-soft:#40291A; --info-soft:#1E2D38;
  --c-in:#81AD8C; --c-out:#ED9255; --c-line:#FFE5C8; --c-target:#45403A;
  --scrim:rgba(0,0,0,.62); --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#0D4715; --brand-2:#81AD8C; --brand-ink:#FFE5C8;
  --bg:#1B1D1C; --surface:#2A2D2B; --surface-2:#343835; --ink:#FFF1E2; --ink-2:#C9C3BA; --ink-3:#8F948F; --line:#3D413E;
  --hero:#0D4715; --hero-ink:#FFF1E2; --hero-2:#ABC8B2; --hero-track:rgba(255,229,200,.14);
  --accent:#ED9255; --accent-soft:#40291A; --accent-ink:#F6C8AA;
  --link:#ED9255;
  --pos:#81AD8C; --neg:#EF7F6C; --warn:#F2AD80; --info:#8AB6D6;
  --pos-soft:#1F3325; --neg-soft:#3D221D; --warn-soft:#40291A; --info-soft:#1E2D38;
  --c-in:#81AD8C; --c-out:#ED9255; --c-line:#FFE5C8; --c-target:#45403A;
  --scrim:rgba(0,0,0,.62); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:.005em}
.eyebrow{font-family:var(--f-display);font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin:0}


.login{min-height:100%;display:grid;place-items:start center;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--brand) 0,var(--brand) 300px,var(--bg) 300px);position:relative;overflow:hidden}
.login::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:radial-gradient(120% 90% at 100% 0,rgba(233,118,43,.35),transparent 55%),radial-gradient(90% 80% at 0 100%,rgba(65,100,74,.9),transparent 70%);pointer-events:none}
.login-card{width:100%;max-width:400px;display:grid;gap:22px;position:relative;padding-top:56px}
.login-brand{display:grid;justify-items:center;text-align:center;gap:10px;color:var(--brand-ink)}
.login-brand .logo{width:84px;height:84px;flex:none;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .6s var(--ease) both}
.login-brand h1{font-size:40px;line-height:1.05;font-weight:800;color:#FFF5E9}
.login-brand h1 em{font-style:normal;color:var(--accent)}
.login-brand p{margin:0;color:#ABC8B2;font-size:13.5px;max-width:30ch}
.login form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 40px rgba(13,71,21,.16);animation:riseIn .55s var(--ease) .1s both}
.demo-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login-foot{font-size:12.5px;color:var(--ink-3);text-align:center}
.login-grass{position:absolute;left:0;right:0;top:230px;height:72px;pointer-events:none;opacity:.55}
.login-grass path{fill:none;stroke:#81AD8C;stroke-width:2.6;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite alternate}
.login-grass path:nth-child(3n){animation-duration:5.1s;stroke:#ED9255}
.login-grass path:nth-child(2n){animation-delay:-1.4s}


body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 18px rgba(13,71,21,.18)}
.topbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .logo{width:38px;height:38px;flex:none;border-radius:11px;background:#fff;object-fit:cover}
.srv{font-size:13px;color:var(--ink-2)}
.srv summary{cursor:pointer;font-weight:600}
.srv-in{display:grid;gap:8px;margin-top:8px}
.srv-in .inp{font-size:13px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-family:var(--f-display);font-size:22px;letter-spacing:.01em;font-weight:800;color:#FFF5E9;white-space:nowrap}
.brand-t b em{font-style:normal;color:var(--accent)}
.brand-t span{font-size:11.5px;color:#ABC8B2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:transform .15s var(--ease)}
.topbar .icon-btn{background:rgba(255,229,200,.1);border-color:rgba(255,229,200,.2);color:var(--brand-ink)}
.bell{position:relative}
.bell .dotn{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--brand);animation:pop .4s var(--ease)}
.feed{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.feed-i{padding:11px 14px;border-top:1px solid var(--line);display:grid;gap:3px}
.feed-i:first-child{border-top:none}
.feed-i.new{background:color-mix(in srgb,var(--accent-soft) 60%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.feed-i b{font-size:13.5px}
.feed-i span{font-size:12px;color:var(--ink-3)}
.notif-box{display:grid;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,229,200,.35);background:var(--accent);color:#fff;font-weight:800;font-size:14px;transition:transform .15s var(--ease)}
.role-pill{font-family:var(--f-display);font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(255,229,200,.14);color:var(--brand-ink)}
.demo-bar{background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:6px 16px}
main.wrap{max-width:600px;margin:0 auto;padding-top:20px;padding-bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
main.wrap > *{animation:riseIn .5s var(--ease) both}
main.wrap > *:nth-child(2){animation-delay:.05s} main.wrap > *:nth-child(3){animation-delay:.1s} main.wrap > *:nth-child(4){animation-delay:.15s}
main.wrap > *:nth-child(5){animation-delay:.2s} main.wrap > *:nth-child(6){animation-delay:.25s} main.wrap > *:nth-child(n+7){animation-delay:.3s}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav-in{max-width:600px;margin:0 auto;display:flex;height:var(--nav-h);align-items:stretch}
.bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-size:13px;letter-spacing:.02em;font-weight:700;color:var(--ink-3);min-width:0;transition:color .2s}
.bnav button .ic{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .25s var(--ease),transform .25s var(--ease)}
.bnav button[aria-current="page"]{color:var(--brand)}
.bnav button[aria-current="page"] .ic{background:var(--accent-soft);color:var(--accent-ink);transform:translateY(-1px)}
:root[data-theme="dark"] .bnav button[aria-current="page"]{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bnav button[aria-current="page"]{color:var(--accent)}}
.bnav .fab-slot{flex:1;display:grid;place-items:center}
.fab{position:relative;width:56px;height:56px;border-radius:18px;border:none;background:linear-gradient(145deg,#ED9255,#E9762B 55%,#C75C15);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(233,118,43,.42);transform:translateY(-14px);transition:transform .2s var(--ease)}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:22px;border:2px solid var(--accent);opacity:0;animation:ring 2.6s ease-out 1s 3}
.fab:active{transform:translateY(-12px) scale(.94)}
.fab .ic svg{width:26px;height:26px;stroke-width:2.4}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);margin-left:-20px;width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:15;opacity:0;pointer-events:none}
.ptr.spinning .ic{animation:rot .8s linear infinite}


.intro{display:grid;gap:4px}
.hello{font-size:14px;font-weight:600;color:var(--ink-2);margin:0}
.hello b{color:var(--accent-ink)}
.intro h1{font-size:33px;line-height:1.12;margin-top:2px}
.intro p{margin:4px 0 0;font-size:13.5px}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#0D4715 0%,#16592A 48%,#41644A 100%);color:var(--hero-ink);border-radius:24px;padding:22px 20px 18px;display:grid;gap:16px;box-shadow:0 18px 36px rgba(13,71,21,.22)}
.hero::before{content:"";position:absolute;width:240px;height:240px;right:-90px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(233,118,43,.45),transparent 65%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero-lbl{font-family:var(--f-display);font-size:14.5px;color:#FFE5C8;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.hero-num{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:4px;color:#FFF5E9}
.hero-sub{font-size:13px;color:var(--hero-2);margin-top:6px;max-width:32ch}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(233,118,43,.22);color:#FFD9BD;margin-top:10px}
.flag .ic svg{width:15px;height:15px}
.plafon{display:grid;gap:7px;background:rgba(255,229,200,.08);border:1px solid rgba(255,229,200,.14);border-radius:16px;padding:12px 14px}
.pl-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}
.pl-row.sm{font-size:12px;color:var(--hero-2)}
.bar{height:10px;border-radius:99px;background:var(--hero-track);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFBA6C,#E9762B);border-radius:99px;transform-origin:left;animation:growX 1.1s var(--ease) .25s both}
.blades{position:absolute;right:6px;top:auto;bottom:0;width:170px;height:120px;opacity:.28;pointer-events:none;z-index:0!important}
.blades path{fill:none;stroke:#FFE5C8;stroke-width:2.6;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.blades path:nth-child(2n){animation-duration:5.2s;animation-delay:-1.3s}
.blades path:nth-child(3n){stroke:#ED9255;animation-delay:-2.1s}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:23px}
.link{border:none;background:none;color:var(--link);font-weight:700;font-size:13px;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.link .ic{transition:transform .2s var(--ease)}
.link:hover .ic{transform:translateX(3px)}
.seg{position:relative;display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:9px 6px;font-family:var(--f-display);font-size:16px;letter-spacing:.01em;font-weight:700;color:var(--ink-2);min-width:0;transition:background .25s var(--ease),color .25s}
.seg button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 12px rgba(13,71,21,.22)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:grid;gap:2px;min-width:0;box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.stat::after{content:"";position:absolute;right:-18px;bottom:-18px;width:56px;height:56px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.stat > *{position:relative;z-index:1}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--ink-3)}
.v.neg,.negc{color:var(--neg)} .v.pos,.posc{color:var(--pos)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel h3{font-size:19px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--f-body)}
.group-h{font-family:var(--f-display);letter-spacing:.02em}
.group-h{font-size:14.5px!important}
.tag{font-family:var(--f-display);font-size:12px!important;letter-spacing:.03em!important}
.chip{font-family:var(--f-display);font-size:15px!important}
.toast{font-family:var(--f-display);font-size:16px!important;letter-spacing:.02em}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1}
.chart .b{transform-box:fill-box;transform-origin:50% 100%;animation:riseY .8s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + .1s)}
.chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .45s forwards}
.chart .pt{animation:fade .4s ease both;animation-delay:calc(var(--i,0) * 60ms + .9s)}
.hb{display:grid;gap:11px}
.hb-row{display:grid;gap:6px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.hb-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c-out);transform-origin:left;animation:growX 1s var(--ease) .2s both}
.track.green i{background:var(--c-in)}
.track.gold i{background:linear-gradient(90deg,#FFBA6C,var(--accent))}
.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv div:last-child{border-bottom:none}
.kv span{color:var(--ink-2)}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0}


.sigs{display:grid;gap:8px}
.sig{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sig::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--sev)}
.sig .ic{color:var(--sev);margin-top:1px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--sev) 13%,transparent)}
.sig .ic svg{width:17px;height:17px}
.sig b{display:block;font-size:14px;line-height:1.35}
.res-k{display:block;font-family:var(--f-display);font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--pos);margin-bottom:2px}

function compute(D) {

  const months = monthsBetween(cfg.PERIODE_MULAI, endMonth < cfg.PERIODE_MULAI ? cfg.PERIODE_MULAI : endMonth);
  let s2 = 0;
  const kasMonthly = months.map(m => { const rows = kas.filter(k => (k.tgl || '').slice(0, 7) === m); const i = sum(rows, k => k.masuk), o = sum(rows, k => k.keluar); s2 += i - o; return { m, in: i, out: o, saldo: s2 }; });

  const jual = D.jual.slice().sort(byDate);

  const piutang = sum(jual.filter(j => j.status === 'Belum Lunas'), j => j.total);
  const prod = D.prod.slice().sort(byDate);
  const panenRows = prod.filter(p => p.keg === 'Panen' || p.panen > 0);
  const panenKg = sum(panenRows, p => p.panen);
  const blok = cfg.BLOK.map(b => ({ b, target: cfg.TARGET_BLOK[b] || 0, panen: sum(panenRows.filter(p => p.blok === b), p => p.panen), jual: sum(jual.filter(j => j.blok === b), j => j.kg), rp: sum(jual.filter(j => j.blok === b), j => j.total), last: prod.filter(p => p.blok === b).slice(-1)[0], n: prod.filter(p => p.blok === b).length, open: prod.filter(p => p.blok === b && p.status === 'Proses').length }));

  const sumBlokTarget = sum(Object.values(cfg.TARGET_BLOK));

// ---------- Grafik SVG ----------
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

function cashChart(rows) {
  const W = 340, H = 196, L = 40, R = 8, T = 10, B = 26;
  const hiV = Math.max(...rows.map(r => Math.max(r.in, r.out, r.saldo)), 1), loV = Math.min(0, ...rows.map(r => r.saldo));
  const step = niceMax((hiV - loV) / 4), top = Math.ceil(hiV / step) * step, bot = Math.floor(loV / step) * step;
  const y = v => T + (top - v) / (top - bot) * (H - T - B);
  const cw = (W - L - R) / rows.length, bw = Math.max(2, Math.min(16, cw * .32));
  let g = '';
  for (let v = bot; v <= top + 1e-6; v += step) g += `<line class="${Math.abs(v) < 1e-6 ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${shortN(v)}</text>`;
  const every = Math.ceil(rows.length / 8);
  rows.forEach((r, i) => {
    const cx = L + cw * i + cw / 2;
    g += `<rect x="${cx - bw - 1}" y="${y(Math.max(r.in, 0))}" width="${bw}" height="${Math.max(0, y(0) - y(r.in))}" rx="2" class="b" style="--i:${i}" fill="var(--c-in)"><title>${mLong(r.m)} masuk ${rp(r.in)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(r.out)}" width="${bw}" height="${Math.max(0, y(0) - y(r.out))}" rx="2" class="b" style="--i:${i}" fill="var(--c-out)"><title>${mLong(r.m)} keluar ${rp(r.out)}</title></rect>`;
    if (i % every === 0 || i === rows.length - 1) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${mLabel(r.m)}</text>`;
  });
  const pts = rows.map((r, i) => [L + cw * i + cw / 2, y(r.saldo)]);
  g += `<polyline class="ln" pathLength="1" points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--c-line)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => g += `<circle class="pt" style="--i:${i}" cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4.5 : 3}" fill="var(--surface)" stroke="var(--c-line)" stroke-width="2"><title>Saldo akhir ${mLong(rows[i].m)}: ${rp(rows[i].saldo)}</title></circle>`);

}
function harvestChart(rows) {

  const hi = Math.max(...rows.map(r => Math.max(r.target, r.panen, r.jual)), 1);
  const step = niceMax(hi / 4), top = Math.ceil(hi / step) * step;
  const y = v => T + (top - v) / top * (H - T - B);
  const cw = (W - L - R) / rows.length, bw = Math.max(4, cw * .62);
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line class="${v === 0 ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${shortN(v, 'kg')}</text>`;
  rows.forEach((r, i) => {
    const cx = L + cw * i + cw / 2;
    if (r.target) g += `<rect x="${cx - bw / 2}" y="${y(r.target)}" width="${bw}" height="${y(0) - y(r.target)}" rx="3" class="b" style="--i:${i}" fill="var(--c-target)"><title>${mLong(r.m)} target ${kg(r.target)}</title></rect>`;

function predData() { return predictHarvest({ kas: S.D.kas, prod: S.D.prod, pred: S.D.pred || { blok: [], est: [] }, cfg: S.C.cfg, today: S.D.today }); }
const tn = x => nf1.format((x || 0) / 1000) + ' t';
const rng = (a, b) => nf1.format((a || 0) / 1000) + '–' + nf1.format((b || 0) / 1000) + ' t';
function bandBar(low, high, target) {
  const max = Math.max(high, target, 1) * 1.08, L = low / max * 100, W = Math.max(1.5, (high - low) / max * 100), T = target / max * 100;
  return `<div class="band"><i class="band-r" style="left:${L}%;width:${W}%"></i>${target ? `<b class="band-t" style="left:${T}%"></b>` : ''}</div>`;
}
function predChart(PR) {
  const rows = PR.months.slice(0, 12);
  const W = 340, H = 196, L = 32, R = 6, T = 10, B = 26;
  const hi = Math.max(1, ...rows.map(r => Math.max(r.high, r.target, r.actual)));
  const step = niceMax(hi / 4), top = Math.ceil(hi / step) * step, y = v => T + (top - v) / top * (H - T - B);
  const cw = (W - L - R) / rows.length, bw = Math.max(5, cw * .66);
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line class="${v === 0 ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${shortN(v, 'kg')}</text>`;
  rows.forEach((r, i) => {
    const cx = L + cw * i + cw / 2;
    if (r.target) g += `<rect class="b" style="--i:${i}" x="${cx - bw / 2}" y="${y(r.target)}" width="${bw}" height="${y(0) - y(r.target)}" rx="3" fill="var(--c-target)"><title>${mLong(r.m)} target ${kg(r.target)}</title></rect>`;
    if (r.high) g += `<rect class="b" style="--i:${i}" x="${cx - bw * .32}" y="${y(r.high)}" width="${bw * .64}" height="${Math.max(2, y(r.low) - y(r.high))}" rx="3" fill="var(--accent)" fill-opacity=".45" stroke="var(--accent)" stroke-width="1.2"><title>${mLong(r.m)} prediksi ${rng(r.low, r.high)}</title></rect><line x1="${cx - bw * .32}" x2="${cx + bw * .32}" y1="${y((r.low + r.high) / 2)}" y2="${y((r.low + r.high) / 2)}" stroke="var(--accent-ink)" stroke-width="1.6"/>`;
    if (r.actual) g += `<rect class="b" style="--i:${i}" x="${cx - bw * .18}" y="${y(r.actual)}" width="${bw * .36}" height="${y(0) - y(r.actual)}" rx="2" fill="var(--c-in)"><title>${mLong(r.m)} aktual ${kg(r.actual)}</title></rect>`;
    if (i % 2 === 0) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${mLabel(r.m)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prediksi panen bulanan">${g}</svg>`;
}

// ===== Prediksi panen per siklus (dipakai bersama oleh Code.gs, aplikasi, dan laporan) =====
function predictHarvest(D, opt) {
  opt = opt || {};
  const cfg = D.cfg || {}, P = cfg.PRED || {};
  const today = D.today || opt.today || new Date().toISOString().slice(0, 10);
  const BLOK = cfg.BLOK || [];
  const FIRST = P.FIRST_DAYS || [75, 90];
  const INT_R = P.INTERVAL_RAINY || [40, 50], INT_D = P.INTERVAL_DRY || [55, 65];
  const RAINY = P.RAINY_MONTHS || [11, 12, 1, 2, 3, 4];
  const YPR = P.KG_PER_RUMPUN || [[0.3, 0.6], [0.5, 0.9], [0.7, 1.2]];
  const DRY = P.DRY_FACTOR || 0.8;
  const SURV = P.SURVIVAL || 0.8;
  const BAND = P.CALIBRATED_BAND || 0.15;
  const endDate = (cfg.PERIODE_SELESAI || '2028-06') + '-28';
  const th1End = (cfg.TH1_SELESAI || '2027-06') + '-30';
  const toD = s => new Date(s + 'T00:00:00Z');
  const fromD = d => d.toISOString().slice(0, 10);
  const addD = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + Math.round(n)); return fromD(d); };
  const diff = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
  const mid = r => (r[0] + r[1]) / 2;
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const isRainy = s => RAINY.indexOf(+s.slice(5, 7)) >= 0;
  const frac = p => { const L = [[1, 'seluruh blok'], [3 / 4, '3/4 blok'], [2 / 3, '2/3 blok'], [1 / 2, '1/2 blok'], [1 / 3, '1/3 blok'], [1 / 4, '1/4 blok']]; for (let i = 0; i < L.length; i++) if (Math.abs(p - L[i][0]) < 0.02) return L[i][1]; return Math.round(p * 100) + '% blok'; };
  const prod = (D.prod || []).slice().sort((a, b) => (a.tgl || '').localeCompare(b.tgl || ''));
  const pred = D.pred || { blok: [], est: [] };

  // Bibit dibeli (pelunasan tidak dihitung agar DP + pelunasan tidak dobel)
  let bibit = 0;
  (D.kas || []).forEach(k => {
    if (k.kat !== 'Biaya Bibit' || /pelunasan/i.test(k.ket || '')) return;
    const t = String(k.ket || '');
    const a = t.match(/(\d+(?:[.,]\d+)?)\s*(rb|ribu)\b/i), b = t.match(/(\d{1,3}(?:\.\d{3})+|\d+)\s*(pcs|bibit|batang|stek)/i);
    if (a) bibit += parseFloat(a[1].replace(',', '.')) * 1000; else if (b) bibit += parseInt(b[1].replace(/\./g, ''), 10);
  });
  const tanamDef = {};
  prod.forEach(p => { if (p.keg === 'Tanam' && p.tgl && !tanamDef[p.blok]) tanamDef[p.blok] = p.tgl; });
  const setB = {}; (pred.blok || []).forEach(b => { setB[b.blok] = b; });
  const tgtB = cfg.TARGET_BLOK || {};
  const planted = BLOK.filter(b => (setB[b] && setB[b].tanam) || tanamDef[b]);
  const tSum = planted.reduce((s, b) => s + (tgtB[b] || 1), 0) || 1;
  const autoR = b => Math.round(bibit * SURV * (tgtB[b] || 1) / tSum / 100) * 100;

  const blocks = BLOK.map(b => {
    const s = setB[b] || {};
    const tanam = s.tanam || tanamDef[b] || '';
    const rumpun = +s.rumpun > 0 ? +s.rumpun : (tanam ? autoR(b) : 0);
    const rSrc = +s.rumpun > 0 ? 'input' : 'perkiraan';
    const acts = prod.filter(p => p.blok === b && (+p.panen || 0) > 0).map(p => ({ tgl: p.tgl, kg: +p.panen }));
    const actualKg = sum(acts, a => a.kg);
    const ests = (pred.est || []).filter(e => e.blok === b && +e.porsi > 0 && /^\d{4}-\d{2}$/.test(e.bulan || '')).sort((x, y) => x.bulan.localeCompare(y.bulan));
    const portions = []; let used = 0;
    ests.forEach(e => { const p = Math.min(+e.porsi, 1 - used); if (p <= 0.005) return; used += p; portions.push({ porsi: p, first: e.bulan + '-15', src: 'estimasi', label: frac(p) }); });
    if (used < 0.995 && tanam && rumpun) {
      let first = addD(tanam, mid(FIRST));
      if (ests.length) { const lastE = ests[ests.length - 1].bulan + '-15', after = addD(lastE, 30); if (first < after) first = after; }
      portions.push({ porsi: 1 - used, first: first, src: ests.length ? 'sisa' : 'otomatis', label: frac(1 - used) });
    }
    // Deret panen mentah per porsi
    const series = rumpun ? portions.map(po => {
      const out = []; let d = po.first, i = 0;
      while (d <= endDate && i < 40) {
        const r = YPR[Math.min(i, YPR.length - 1)], sf = isRainy(d) ? 1 : DRY;
        out.push({ date: d, idx: i, porsi: po.porsi, label: po.label, src: po.src, r: r, low: rumpun * po.porsi * r[0] * sf, high: rumpun * po.porsi * r[1] * sf });
        d = addD(d, isRainy(d) ? mid(INT_R) : mid(INT_D)); i++;
      }
      return out;
    }) : [];
    // Cocokkan tiap panen aktual ke perkiraan terdekat
    let matchedMid = 0;
    acts.forEach(a => {
      let best = null, bd = 1e9;
      series.forEach((sr, si) => sr.forEach(c => { if (c.used) return; const dd = Math.abs(diff(c.date, a.tgl)); if (dd < bd) { bd = dd; best = c; best.si = si; } }));
      if (best) { best.used = true; best.act = a.tgl; matchedMid += (best.low + best.high) / 2; }
    });
    const factor = acts.length && matchedMid > 0 ? Math.max(0.3, Math.min(3, actualKg / matchedMid)) : null;
    let cuts = [], late = false;
    series.forEach((sr, si) => {
      const ms = sr.filter(c => c.used);
      let shift = 0, after = -1;
      if (ms.length) { const lm = ms[ms.length - 1]; shift = diff(lm.date, lm.act); after = lm.idx; }
      else if (sr.length && sr[0].date < today) {
        shift = diff(sr[0].date, addD(today, 7));
        if (!(portions[si].src === 'estimasi' && sr[0].date.slice(0, 7) === today.slice(0, 7))) { late = true; portions[si].late = true; }
      }
      sr.filter(c => c.idx > after).forEach(c => {
        const d = addD(c.date, shift); if (d > endDate) return;
        const sf = isRainy(d) ? 1 : DRY, lo = rumpun * c.porsi * c.r[0] * sf, hi = rumpun * c.porsi * c.r[1] * sf;
        if (factor) { const m = (lo + hi) / 2 * factor; cuts.push(Object.assign({}, c, { date: d, low: m * (1 - BAND), high: m * (1 + BAND), calibrated: true })); }
        else cuts.push(Object.assign({}, c, { date: d, low: lo, high: hi }));
      });
    });
    cuts.sort((x, y) => x.date.localeCompare(y.date));
    const th = cuts.filter(c => c.date <= th1End);
    const actTh1 = sum(acts.filter(a => a.tgl <= th1End), a => a.kg);
    let status;
    if (!tanam) status = 'Belum ditanam';
    else if (!rumpun) status = 'Jumlah rumpun belum diisi';
    else if (factor) status = 'Dikalibrasi dengan ' + acts.length + ' panen aktual (faktor ' + (Math.round(factor * 100) / 100).toString().replace('.', ',') + '×)';
    else if (ests.length) status = 'Mengikuti estimasi pengelola';
    else status = 'Perkiraan otomatis dari umur tanam';
    return {
      blok: b, tanam: tanam, rumpun: rumpun, rumpunSrc: rSrc, tanamSrc: s.tanam ? 'input' : (tanamDef[b] ? 'catatan tanam' : ''),
      ests: ests, portions: portions, cuts: cuts, acts: acts, actualKg: actualKg, factor: factor, late: late, status: status,
      next: cuts[0] || null, target: tgtB[b] || 0,
      th1Low: actTh1 + sum(th, c => c.low), th1High: actTh1 + sum(th, c => c.high),
      allLow: actualKg + sum(cuts, c => c.low), allHigh: actualKg + sum(cuts, c => c.high)
    };
  });

  const thisM = today.slice(0, 7);
  const months = [];
  let y = +thisM.slice(0, 4), m = +thisM.slice(5, 7);
  const endM = endDate.slice(0, 7);
  while ((y + '-' + ('0' + m).slice(-2)) <= endM) { months.push(y + '-' + ('0' + m).slice(-2)); if (++m > 12) { m = 1; y++; } }
  const allCuts = []; blocks.forEach(B => B.cuts.forEach(c => allCuts.push(Object.assign({ blok: B.blok }, c))));
  allCuts.sort((a, b) => a.date.localeCompare(b.date));
  const monthly = months.map(mk => {
    const cs = allCuts.filter(c => c.date.slice(0, 7) === mk);
    const act = sum(prod.filter(p => (p.tgl || '').slice(0, 7) === mk && +p.panen > 0), p => +p.panen);
    return { m: mk, low: sum(cs, c => c.low), high: sum(cs, c => c.high), actual: act, target: (cfg.TARGET_BULANAN || {})[mk] || 0, blok: cs.map(c => c.blok).filter((x, i, a) => a.indexOf(x) === i) };
  });
  const in3 = monthly.slice(0, 3);
  return {
    today: today, bibit: bibit, survival: SURV, params: { FIRST: FIRST, INT_R: INT_R, INT_D: INT_D, YPR: YPR, DRY: DRY, BAND: BAND },
    blocks: blocks, months: monthly, cuts: allCuts, next: allCuts[0] || null,
    th1: { low: sum(blocks, b => b.th1Low), high: sum(blocks, b => b.th1High), target: cfg.TARGET_TH1_KG || 0, actual: sum(blocks, b => sum(b.acts.filter(a => a.tgl <= th1End), a => a.kg)) },
    next3: { low: sum(in3, x => x.low), high: sum(in3, x => x.high), from: in3.length ? in3[0].m : '', to: in3.length ? in3[in3.length - 1].m : '' }
  };
}

function buildMonthlyReport(D, mk, opt) {
  opt = opt || {};
  const cfg = D.cfg;
  const BL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const G = '#0D4715', G2 = '#41644A', OR = '#E9762B', CH = '#FFE5C8', JET = '#2A2D2B', MUTE = '#6b716d', LINE = '#F0DCC5', BG = '#FFF6EC';
  const RED = '#B8321F', OK = '#1D7A2B';
  const F = "font-family:'Paralucent Text',Arial,Helvetica,sans-serif;";
  const FD = "font-family:'Paralucent Cond','Arial Narrow',Arial,Helvetica,sans-serif;";
  const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const th = n => String(Math.round(Math.abs(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const rp = n => ((n || 0) < 0 ? '−' : '') + 'Rp' + th(n);
  const jt = n => { const a = Math.abs(n || 0), s = (n || 0) < 0 ? '−' : ''; return a >= 1e6 ? s + 'Rp' + (Math.round(a / 1e5) / 10).toString().replace('.', ',') + ' jt' : rp(n); };
  const kg = n => th(n) + ' kg';
  const pct = x => (Math.round((x || 0) * 1000) / 10).toString().replace('.', ',') + '%';
  const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
  const ml = k => BL[+k.slice(5) - 1] + ' ' + k.slice(0, 4);
  const tg = iso => { if (!iso) return '–'; const p = iso.split('-'); return +p[2] + ' ' + BL[+p[1] - 1].slice(0, 3); };
  const byT = (a, b) => (a.tgl || '').localeCompare(b.tgl || '');
  const inM = x => (x.tgl || '').slice(0, 7) === mk;
  const before = x => !!x.tgl && x.tgl.slice(0, 7) < mk;
  const upto = x => !!x.tgl && x.tgl.slice(0, 7) <= mk;

  const kas = D.kas || [], jual = D.jual || [], prod = D.prod || [], mit = D.mit || [];
  const saldoAwal = sum(kas.filter(before), k => (k.masuk || 0) - (k.keluar || 0));
  const kM = kas.filter(inM).sort(byT);
  const masuk = sum(kM, k => k.masuk || 0), keluar = sum(kM, k => k.keluar || 0), saldoAkhir = saldoAwal + masuk - keluar;
  const modalKum = sum(kas.filter(upto).filter(k => k.kat === 'Modal Investor Masuk'), k => k.masuk || 0);
  const keluarKum = sum(kas.filter(upto), k => k.keluar || 0);
  const kat = {}; kM.forEach(k => { if (k.keluar) kat[k.kat] = (kat[k.kat] || 0) + k.keluar; });
  const katL = Object.keys(kat).map(k => [k, kat[k]]).sort((a, b) => b[1] - a[1]);
  const noBukti = kM.filter(k => !k.ref && !(k.foto || []).length);

  const pM = prod.filter(inM).sort(byT);
  const isPanen = p => p.keg === 'Panen' || (p.panen || 0) > 0;
  const panenM = sum(pM.filter(isPanen), p => p.panen || 0);
  const panenKum = sum(prod.filter(upto).filter(isPanen), p => p.panen || 0);
  const tgtM = (cfg.TARGET_BULANAN || {})[mk] || 0;
  const tgtKum = sum(Object.keys(cfg.TARGET_BULANAN || {}).filter(m => m <= mk), m => cfg.TARGET_BULANAN[m]);
  const jM = jual.filter(inM);
  const jualKg = sum(jM, j => j.kg || 0), jualRp = sum(jM, j => j.total || 0);
  const piutang = sum(jual.filter(upto).filter(j => j.status === 'Belum Lunas'), j => j.total || 0);
  const kendala = pM.filter(p => ['Rendah', 'Sedang', 'Tinggi'].indexOf(p.keparahan) >= 0);
  const riskAktif = mit.filter(m => m.status !== 'Selesai').sort((a, b) => b.p * b.d - a.p * a.d);
  const riskDone = mit.filter(m => m.status === 'Selesai');
  const media = [];
  pM.concat(kM).forEach(x => (x.foto || []).forEach(u => media.push({ u: u, x: x })));
  const blokSum = (cfg.BLOK || []).map(b => {
    const all = prod.filter(p => p.blok === b && upto(p)).sort(byT);
    return { b: b, n: pM.filter(p => p.blok === b).length, last: all[all.length - 1], panen: sum(all.filter(isPanen), p => p.panen || 0), target: (cfg.TARGET_BLOK || {})[b] || 0 };
  });

  const high = [];
  if (masuk || keluar) high.push('Kas masuk ' + jt(masuk) + ' dan kas keluar ' + jt(keluar) + ' bulan ini; saldo akhir <b>' + rp(saldoAkhir) + '</b>.');
  if (katL.length) high.push('Pengeluaran terbesar untuk <b>' + e(katL[0][0]) + '</b> (' + jt(katL[0][1]) + ', ' + pct(katL[0][1] / keluar) + ' dari pengeluaran bulan ini).');
  high.push('Modal investor diterima kumulatif ' + jt(modalKum) + ' dari plafon ' + jt(cfg.PLAFON) + ' (' + pct(modalKum / cfg.PLAFON) + ').');
  if (panenM) high.push('Panen bulan ini <b>' + kg(panenM) + '</b>' + (tgtM ? ' dari target ' + kg(tgtM) + ' (' + pct(panenM / tgtM) + ')' : '') + '.');
  else if (tgtM) high.push('Belum ada panen tercatat; target proposal bulan ini ' + kg(tgtM) + '.');
  if (pM.length) high.push(pM.length + ' kegiatan lapangan tercatat di ' + blokSum.filter(x => x.n).length + ' blok' + (kendala.length ? ', ' + kendala.length + ' di antaranya dengan kendala' : '') + '.');
  if (noBukti.length) high.push(noBukti.length + ' transaksi bulan ini belum dilengkapi bukti foto/kuitansi.');
  if (saldoAkhir < 0) high.push('<span style="color:' + RED + '">Saldo kas akhir bulan negatif; selisih ditalangi pengelola.</span>');

  const sec = (t, inner) => '<tr><td style="padding:22px 24px 0">' +
    '<div style="' + FD + 'font-size:20px;font-weight:800;color:' + G + ';margin:0 0 10px;letter-spacing:.01em">' + t + '</div>' + inner + '</td></tr>';
  const card = (k, v, s, col) => '<td width="50%" valign="top" style="padding:5px"><div style="background:#fff;border:1px solid ' + LINE + ';border-radius:12px;padding:12px 14px">' +
    '<div style="' + F + 'font-size:12px;color:' + MUTE + '">' + k + '</div><div style="' + FD + 'font-size:24px;font-weight:800;color:' + (col || JET) + ';line-height:1.2">' + v + '</div>' +
    '<div style="' + F + 'font-size:11.5px;color:' + MUTE + '">' + (s || '&nbsp;') + '</div></div></td>';
  const tbl = (head, rows, empty) => rows.length ? '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;' + F + 'font-size:12.5px;color:' + JET + '"><tr>' +
    head.map(h => '<td style="padding:7px 6px;background:' + CH + ';font-weight:700;color:#964510;' + (h.r ? 'text-align:right;' : '') + '">' + h.t + '</td>').join('') + '</tr>' +
    rows.map(r => '<tr>' + r.map((c, i) => '<td valign="top" style="padding:7px 6px;border-bottom:1px solid ' + LINE + ';' + (head[i].r ? 'text-align:right;white-space:nowrap;' : '') + '">' + c + '</td>').join('') + '</tr>').join('') + '</table>'
    : '<div style="' + F + 'font-size:13px;color:' + MUTE + ';background:#fff;border:1px dashed ' + LINE + ';border-radius:10px;padding:12px">' + empty + '</div>';
  const bar = (label, val, max, right, col) => '<div style="margin:0 0 9px;' + F + 'font-size:12.5px"><table width="100%" cellpadding="0" cellspacing="0"><tr><td style="color:' + JET + '">' + label + '</td><td style="text-align:right;font-weight:700;white-space:nowrap">' + right + '</td></tr></table>' +
    '<div style="height:8px;background:' + CH + ';border-radius:99px;margin-top:4px"><div style="height:8px;width:' + Math.max(2, Math.min(100, max ? val / max * 100 : 0)) + '%;background:' + (col || OR) + ';border-radius:99px"></div></div></div>';
  const lvl = s => s >= 15 ? ['Tinggi', RED] : s >= 8 ? ['Sedang', '#A35400'] : ['Rendah', OK];
  const link = (u, t) => /^https?:/.test(u) ? '<a href="' + e(u) + '" style="color:' + G2 + ';font-weight:700">' + t + '</a>' : t;

  let h = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Rumput Odot ' + ml(mk) + '</title>' +
    (opt.fontCss || '') + '</head><body style="margin:0;padding:0;background:' + BG + '">' +
    '<table width="100%" cellpadding="0" cellspacing="0" style="background:' + BG + '"><tr><td align="center" style="padding:' + (opt.pdf ? '0' : '16px 8px') + '">' +
    '<table width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;background:' + BG + ';' + F + '">';
  h += '<tr><td style="background:' + G + ';padding:22px 24px;border-radius:' + (opt.pdf ? '0' : '18px 18px 0 0') + '"><table width="100%" cellpadding="0" cellspacing="0"><tr>' +
    (opt.logo ? '<td width="64" valign="middle"><img src="' + e(opt.logo) + '" width="56" height="56" alt="Qurbandong" style="display:block;border-radius:14px;background:#fff"></td>' : '') +
    '<td valign="middle" style="padding-left:' + (opt.logo ? '12px' : '0') + '"><div style="' + FD + 'font-size:13px;font-weight:700;letter-spacing:.1em;color:' + OR + '">LAPORAN BULANAN</div>' +
    '<div style="' + FD + 'font-size:26px;font-weight:800;color:#FFF5E9;line-height:1.1">Usaha Tani Rumput Odot</div>' +
    '<div style="' + F + 'font-size:13px;color:#ABC8B2;margin-top:3px">' + ml(mk) + ' · Qurbandong Farm × ' + e(cfg.INVESTOR) + '</div></td></tr></table></td></tr>';
  h += '<tr><td style="padding:16px 19px 0"><table width="100%" cellpadding="0" cellspacing="0"><tr>' +
    card('Kas masuk', jt(masuk), kM.filter(k => k.masuk).length + ' transaksi', OK) + card('Kas keluar', jt(keluar), kM.filter(k => k.keluar).length + ' transaksi', '#964510') + '</tr><tr>' +
    card('Saldo akhir bulan', jt(saldoAkhir), 'Saldo awal ' + jt(saldoAwal), saldoAkhir < 0 ? RED : G) +
    card('Panen bulan ini', kg(panenM), tgtM ? 'Target ' + kg(tgtM) : 'Tidak ada target bulan ini', G2) + '</tr></table></td></tr>';
  h += sec('Sorotan bulan ini', '<ul style="margin:0;padding-left:18px;' + F + 'font-size:13.5px;line-height:1.6;color:' + JET + '">' + high.map(x => '<li>' + x + '</li>').join('') + '</ul>' +
    (opt.note ? '<div style="margin-top:12px;background:#fff;border-left:4px solid ' + OR + ';border-radius:8px;padding:10px 12px;' + F + 'font-size:13px;color:' + JET + '"><b>Catatan pengelola:</b><br>' + e(opt.note).replace(/\n/g, '<br>') + '</div>' : ''));
  h += sec('1. Keuangan',
    tbl([{ t: 'Posisi kas' }, { t: 'Nominal', r: 1 }], [['Saldo awal ' + ml(mk), rp(saldoAwal)], ['Kas masuk', rp(masuk)], ['Kas keluar', '−' + rp(keluar).replace('−', '')], ['<b>Saldo akhir</b>', '<b>' + rp(saldoAkhir) + '</b>'],
      ['Modal investor kumulatif', rp(modalKum) + ' / ' + jt(cfg.PLAFON)], ['Pengeluaran kumulatif', rp(keluarKum)]], '') +
    (katL.length ? '<div style="height:14px"></div><div style="' + F + 'font-size:13px;font-weight:700;margin-bottom:8px">Pengeluaran per kategori</div>' + katL.map(x => bar(e(x[0]), x[1], katL[0][1], rp(x[1]) + ' · ' + pct(x[1] / keluar))).join('') : '') +
    '<div style="height:10px"></div><div style="' + F + 'font-size:13px;font-weight:700;margin-bottom:8px">Rincian transaksi (' + kM.length + ')</div>' +
    tbl([{ t: 'Tgl' }, { t: 'Keterangan' }, { t: 'Nominal', r: 1 }, { t: 'Bukti' }],
      kM.map(k => [tg(k.tgl), e(k.ket) + '<div style="color:' + MUTE + ';font-size:11.5px">' + e(k.kat) + '</div>', k.masuk ? '<span style="color:' + OK + '">+' + rp(k.masuk) + '</span>' : '−' + rp(k.keluar),
        (k.foto || []).length ? link(k.foto[0], 'Foto') : (k.ref ? e(k.ref) : '<span style="color:' + RED + '">Belum ada</span>')]), 'Tidak ada transaksi kas pada bulan ini.'));
  h += sec('2. Produksi & lahan',
    tbl([{ t: 'Blok' }, { t: 'Kegiatan' }, { t: 'Terakhir' }, { t: 'Panen / target', r: 1 }],
      blokSum.map(x => ['<b>' + e(x.b) + '</b>', x.n ? x.n + '×' : '–', x.last ? e(x.last.keg) + ' · ' + tg(x.last.tgl) : 'Belum dikerjakan', kg(x.panen) + ' / ' + th(x.target / 1000) + ' ton']), '') +
    '<div style="height:14px"></div><div style="' + F + 'font-size:13px;font-weight:700;margin-bottom:8px">Kegiatan bulan ini (' + pM.length + ')</div>' +
    tbl([{ t: 'Tgl' }, { t: 'Blok' }, { t: 'Kegiatan & uraian' }, { t: 'Status' }],
      pM.map(p => [tg(p.tgl), e(p.blok), '<b>' + e(p.keg) + '</b> · ' + e(p.kejadian) + (p.panen ? ' · <b>' + kg(p.panen) + '</b>' : '') + ((p.foto || []).length ? ' · ' + link(p.foto[0], (p.foto.length > 1 ? p.foto.length + ' media' : 'Media')) : ''),
        '<span style="color:' + (p.status === 'Selesai' ? OK : '#A35400') + ';font-weight:700">' + e(p.status || '–') + '</span>']), 'Tidak ada kegiatan lapangan tercatat pada bulan ini.'));
  h += sec('3. Panen & penjualan',
    bar('Panen bulan ini vs target', panenM, tgtM || 1, kg(panenM) + (tgtM ? ' / ' + kg(tgtM) : ''), G2) +
    bar('Panen kumulatif vs target kumulatif', panenKum, tgtKum || 1, kg(panenKum) + ' / ' + kg(tgtKum), G2) +
    bar('Panen kumulatif vs target tahun ke-1', panenKum, cfg.TARGET_TH1_KG, pct(panenKum / cfg.TARGET_TH1_KG) + ' dari ' + kg(cfg.TARGET_TH1_KG), OR) +
    tbl([{ t: 'Penjualan bulan ini' }, { t: 'Nilai', r: 1 }], [['Volume terjual', kg(jualKg)], ['Pendapatan', rp(jualRp)], ['Jumlah transaksi', String(jM.length)], ['Piutang (belum lunas, kumulatif)', rp(piutang)]], ''));
  if (typeof predictHarvest === 'function') {
    const PR = predictHarvest(D);
    const t1 = x => (Math.round(x / 100) / 10).toString().replace('.', ',') + ' t';
    const up = PR.cuts.slice(0, 8);
    h += sec('Prediksi panen (per ' + tg(PR.today) + ')',
      '<div style="' + F + 'font-size:13px;color:' + JET + ';margin-bottom:10px">Proyeksi tahun ke-1: <b>' + t1(PR.th1.low) + ' – ' + t1(PR.th1.high) + '</b> dari target ' + t1(PR.th1.target) +
      '. Tiga bulan ke depan: <b>' + t1(PR.next3.low) + ' – ' + t1(PR.next3.high) + '</b>.</div>' +
      tbl([{ t: 'Perkiraan' }, { t: 'Blok' }, { t: 'Rentang hasil', r: 1 }],
        up.map(c => [tg(c.date), e(c.blok) + ' · ' + e(c.label) + (c.calibrated ? ' <span style="color:' + OK + ';font-size:11px">terkalibrasi</span>' : ''), t1(c.low) + ' – ' + t1(c.high)]), 'Belum ada blok yang bisa diprediksi.') +
      '<div style="' + F + 'font-size:11.5px;color:' + MUTE + ';margin-top:8px">Rentang dihitung dari jumlah rumpun hidup, umur tanam, musim, dan estimasi pengelola; menyempit otomatis setelah ada panen aktual.</div>');
  }
  h += sec('4. Kendala & mitigasi',
    '<div style="' + F + 'font-size:13px;font-weight:700;margin-bottom:8px">Kendala lapangan bulan ini (' + kendala.length + ')</div>' +
    tbl([{ t: 'Tgl' }, { t: 'Kendala' }, { t: 'Tindak lanjut' }],
      kendala.map(p => [tg(p.tgl), '<b>' + e(p.blok) + ' · ' + e(p.keparahan) + '</b><br>' + e(p.kejadian), e(p.tindak || '–') + '<div style="font-size:11.5px;color:' + (p.status === 'Selesai' ? OK : '#A35400') + ';font-weight:700">' + e(p.status || '') + '</div>']), 'Tidak ada kendala lapangan tercatat pada bulan ini.') +
    '<div style="height:14px"></div><div style="' + F + 'font-size:13px;font-weight:700;margin-bottom:8px">Register risiko aktif (' + riskAktif.length + ')</div>' +
    tbl([{ t: 'ID' }, { t: 'Risiko & langkah' }, { t: 'Status' }],
      riskAktif.map(m => { const L = lvl(m.p * m.d); return ['<b>' + e(m.id) + '</b><div style="font-size:11px;color:' + L[1] + ';font-weight:700">' + L[0] + ' · ' + (m.p * m.d) + '</div>',
        e(m.risiko) + '<div style="color:' + MUTE + ';font-size:11.5px">' + e(String(m.langkah || '').split(/\n+/)[0]) + (m.catatan ? '<br><i>' + e(m.catatan) + '</i>' : '') + '</div>',
        e(m.status) + '<div style="font-size:11px;color:' + MUTE + '">PJ ' + e(m.pj || '–') + (m.target ? ' · ' + tg(m.target) : '') + '</div>']; }), 'Tidak ada risiko aktif.') +
    (riskDone.length ? '<div style="height:10px"></div><div style="' + F + 'font-size:12.5px;color:' + OK + '"><b>Sudah diselesaikan:</b> ' + riskDone.map(m => e(m.id) + ' ' + e(m.risiko)).join('; ') + '</div>' : ''));
  h += sec('5. Dokumentasi',
    media.length ? '<div style="' + F + 'font-size:13px;line-height:1.7">' + media.length + ' foto/video tercatat bulan ini:<br>' +
      media.slice(0, 15).map((m, i) => link(m.u, (i + 1) + '. ' + e(m.x.blok || m.x.kat || '') + ' · ' + tg(m.x.tgl))).join('<br>') + (media.length > 15 ? '<br>…dan ' + (media.length - 15) + ' lainnya di aplikasi.' : '') + '</div>'
      : '<div style="' + F + 'font-size:13px;color:' + MUTE + '">Belum ada foto/video yang dilampirkan bulan ini.</div>');
  h += '<tr><td style="padding:24px"><div style="background:' + G + ';border-radius:14px;padding:16px 18px;' + F + 'font-size:13px;color:#FFE5C8;line-height:1.6">' +
    (opt.appUrl ? 'Detail lengkap, foto kuitansi, dan video lahan bisa dilihat di aplikasi <a href="' + e(opt.appUrl) + '" style="color:' + OR + ';font-weight:700">QDF Odot</a>.<br>' : '') +
    'Laporan ini disusun otomatis dari spreadsheet pelaporan' + (opt.generated ? ' pada ' + e(opt.generated) + ' WIB' : '') + '. Pertanyaan atau koreksi: balas email ini atau hubungi pengelola Qurbandong Farm.</div></td></tr>';
  h += '</table></td></tr></table></body></html>';
  return { html: h, subject: 'Laporan Bulanan Rumput Odot · ' + ml(mk) + ' · Qurbandong Farm', label: ml(mk) };
}


// ---------- Laporan bulanan ----------
function reportMonths() { const C = S.C; const end = C.thisMonth < C.cfg.PERIODE_SELESAI ? C.thisMonth : C.cfg.PERIODE_SELESAI; return monthsBetween(C.cfg.PERIODE_MULAI, end).reverse(); }
function defaultReportMonth() { const ms = reportMonths(); return ms.length > 1 ? ms[1] : ms[0]; }
function reportPanel() {
  const ms = reportMonths(), def = defaultReportMonth();
  return `<div class="panel"><div class="ph"><h3>Laporan bulanan</h3><span class="small muted">${isAdmin() ? 'otomatis tiap tgl 1' : 'dikirim ke email Anda tiap tgl 1'}</span></div>
    <p class="small muted" style="margin:0">Ringkasan keuangan, kegiatan per blok, panen, kendala, mitigasi, dan dokumentasi dalam satu laporan.</p>
    <div class="row2"><select class="inp" id="repMonth" aria-label="Bulan laporan">${ms.map(m => `<option value="${m}" ${m === def ? 'selected' : ''}>${mLong(m)}</option>`).join('')}</select><button class="btn primary sm" data-act="openReport">Lihat</button></div></div>`;
}
function openReport() {
  const mk = ($('#repMonth') || {}).value || defaultReportMonth();
  const r = buildMonthlyReport({ kas: S.D.kas, jual: S.D.jual, prod: S.D.prod, mit: S.D.mit, pred: S.D.pred || { blok: [], est: [] }, today: S.D.today, cfg: S.C.cfg }, mk, { logo: LOGO_SRC, appUrl: IS_GAS || DEMO ? '' : location.origin, generated: '' });
  openSheet(`${sheetHead('Laporan ' + esc(r.label))}
    <iframe class="rep-frame" title="Laporan ${esc(r.label)}" srcdoc="${esc(r.html)}"></iframe>
    ${isAdmin() ? `<div class="panel" style="gap:10px"><div class="field"><label for="repNote">Catatan pengelola <span class="muted">(opsional, ikut terkirim)</span></label><textarea class="inp" id="repNote" placeholder="mis. Panen perdana Blok A dijadwalkan 5 November"></textarea></div>
      <div class="btn-row"><button class="btn ghost sm" data-act="sendReport" data-test="1" data-m="${mk}">Kirim uji ke saya</button><button class="btn accent sm" data-act="askSendReport" data-m="${mk}">Kirim ke investor</button></div><div id="repBox"></div></div>` : ''}`);
}

// ---------- Pembaruan & notifikasi ----------
const seenKey = () => 'qdf_seen_' + (S.user ? S.user.username : '');
function updateBell() {
  const el = $('#bellCount'); if (!el || !S.D) return;
  const seen = store.get(seenKey()) || '';
  const n = (S.D.log || []).filter(l => l.waktu > seen).length;
  el.hidden = !n; el.textContent = n > 9 ? '9+' : String(n);
}
const fmtWaktu = w => { if (!w) return ''; const [d, t] = w.split('T'); return dLong(d) + (t ? ' · ' + t : ''); };
function openFeed() {
  const seen = store.get(seenKey()) || '';
  const log = S.D.log || [];
  openSheet(`${sheetHead('Pembaruan')}
    <div class="panel notif-box" id="notifBox">${notifPanel()}</div>

const driveIdOf = u => { const m = String(u).match(/\/d\/([\w-]{20,})/) || String(u).match(/[?&]id=([\w-]{20,})/); return m ? m[1] : ''; };

}

      ${rec ? `<button type="button" class="btn danger block" data-act="askDelete" data-v="mit" data-row="${rec.row}">${ic('trash')} Hapus risiko</button><div id="delBox"></div>` : ''}</form>`;
  }
  openSheet(body);
  renderPhotos();
}
function katOptions(jenis, sel) {
  const list = jenis === 'Masuk' ? S.C.cfg.KATEGORI_MASUK : S.C.cfg.KATEGORI_KELUAR;
  return list.map(k => `<option ${k === sel ? 'selected' : ''}>${esc(k)}</option>`).join('');
}
function openInputChooser() {
  openSheet(`${sheetHead('Input data baru')}
    <button class="choice" data-act="form" data-v="kas"><span class="tx-ic out">${ic('out')}</span><span><b>Transaksi kas</b><span class="d">Biaya, pencairan modal, pemasukan lain + foto nota</span></span>${ic('chev')}</button>
    <button class="choice" data-act="form" data-v="prod" data-keg="Panen"><span class="tx-ic harv">${ic('harvest')}</span><span><b>Hasil panen</b><span class="d">Kg panen per blok + foto timbangan</span></span>${ic('chev')}</button>
    <button class="choice" data-act="form" data-v="jual"><span class="tx-ic in">${ic('in')}</span><span><b>Penjualan</b><span class="d">Kg × harga, pembeli, status bayar + bukti</span></span>${ic('chev')}</button>
    <button class="choice" data-act="form" data-v="prod"><span class="tx-ic prod">${ic('sprout')}</span><span><b>Kegiatan & kendala lapangan</b><span class="d">Tanam, pemupukan, penyemprotan, perawatan</span></span>${ic('chev')}</button>
    <button class="choice" data-act="form" data-v="mit"><span class="tx-ic out" style="background:var(--warn-soft);color:var(--warn)">${ic('shield')}</span><span><b>Risiko & mitigasi</b><span class="d">Tambah risiko dan langkah penanganan</span></span>${ic('chev')}</button>`);
}
function userForm(username) {
  const u = username ? (S.users || []).find(x => x.username === username) : null;
  openSheet(`${sheetHead(u ? 'Ubah pengguna' : 'Pengguna baru')}
  <form class="form" data-on="saveUser" novalidate>
    <div class="field"><label for="u-un">Username</label><input class="inp" id="u-un" name="username" value="${esc(u ? u.username : '')}" ${u ? 'readonly' : ''} autocapitalize="none" placeholder="huruf kecil, tanpa spasi"></div>
    <div class="field"><label for="u-nm">Nama</label><input class="inp" id="u-nm" name="nama" value="${esc(u ? u.nama : '')}"></div>
    <div class="field"><label for="u-em">Email <span class="muted">(untuk laporan bulanan)</span></label><input class="inp" id="u-em" name="email" type="email" inputmode="email" autocapitalize="none" value="${esc(u ? (u.email || '') : '')}" placeholder="nama@email.com"></div>
    <div class="field"><span class="flabel">Peran</span>${opts('role', ['investor', 'pengelola'], u ? u.role : 'investor', 'split', ['Investor (lihat)', 'Pengelola (input)'])}</div>
    ${u ? `<label class="check"><input type="checkbox" name="aktif" ${u.aktif ? 'checked' : ''}><span>Akun aktif (bisa login)</span></label>` : ''}
    <div class="field"><label for="u-pw">${u ? 'Reset password <span class="muted">(kosongkan jika tidak diubah)</span>' : 'Password awal'}</label><input class="inp" id="u-pw" name="password" type="text" autocomplete="off" minlength="6"></div>
    <div id="formErr"></div><button class="btn primary block" type="submit">Simpan</button></form>`);
  S.form = { kind: 'user', isNew: !u };
}

// ---------- Simpan ----------
async function uploadPhotos() {
  const out = [], list = S.form.photos, btn = $('#sheetBody button[type="submit"]');
  let n = 0; const total = list.filter(p => p.kind === 'new').length;
  for (const p of list) {
    if (p.kind === 'url') { out.push(p.url); continue; }
    n++; if (btn) btn.textContent = `Mengunggah foto ${n}/${total}…`;
    const r = await call('upload', { data: p.data, mime: 'image/jpeg', name: p.name });
    p.kind = 'url'; p.url = r.url; out.push(r.url);
  }
  return out;
}
async function submitForm(form, action, build) {
  if (S.busy) return;
  const btn = $('button[type="submit"]', form), err = $('#formErr'), label = btn.textContent;
  err.innerHTML = '';
  let payload;
  try { payload = build(new FormData(form)); } catch (e) { err.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  S.busy = true; btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    if (S.form && S.form.photos) payload.foto = await uploadPhotos();
    btn.textContent = 'Menyimpan…';
    await call(action, payload);
    closeSheet(); await refresh('Tersimpan ke spreadsheet');
  } catch (e) { err.innerHTML = `<div class="err">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = label; }
  finally { S.busy = false; }
}
const need = (cond, msg) => { if (!cond) throw new Error(msg); };
const FORMS = {
  saveKas: f => {
    const jenis = f.get('jenis'), nom = parseNum(f.get('nominal')), r = S.form.rec;
    need(f.get('tgl'), 'Isi tanggal.'); need(String(f.get('ket')).trim(), 'Isi keterangan.'); need(nom > 0, 'Isi nominal lebih dari 0.');
    return { row: S.form.row, guard: r ? r.ket : undefined, tgl: f.get('tgl'), kat: f.get('kat'), ket: String(f.get('ket')).trim(), masuk: jenis === 'Masuk' ? nom : 0, keluar: jenis === 'Keluar' ? nom : 0, ref: String(f.get('ref') || '').trim() };
  },
  saveJual: f => {
    const kgv = parseNum(f.get('kg')), hg = parseNum(f.get('harga')), r = S.form.rec;
    need(kgv > 0, 'Isi kg terjual.'); need(hg > 0, 'Isi harga per kg.');
    return { row: S.form.row, guard: r ? r.kg : undefined, tgl: f.get('tgl'), blok: f.get('blok'), kg: kgv, harga: hg, pembeli: String(f.get('pembeli') || '').trim(), status: f.get('status'), catatan: String(f.get('catatan') || '').trim(), catatKas: !!f.get('catatKas') };
  },
  saveProd: f => {
    const keg = f.get('keg'), pn = parseNum(f.get('panen')), r = S.form.rec;
    need(keg !== 'Panen' || pn > 0, 'Isi hasil panen (kg).'); need(String(f.get('kejadian')).trim(), 'Isi uraian kegiatan.');
    return { row: S.form.row, guard: r ? r.kejadian : undefined, tgl: f.get('tgl'), blok: f.get('blok'), keg, panen: keg === 'Panen' ? pn : (pn || 0), kejadian: String(f.get('kejadian')).trim(), keparahan: f.get('keparahan'), tindak: String(f.get('tindak') || '').trim(), status: f.get('status') };
  },
  saveMit: f => {
    const r = S.form.rec;
    need(String(f.get('risiko')).trim(), 'Isi uraian risiko.'); need(String(f.get('langkah')).trim(), 'Isi minimal satu langkah mitigasi.');
    return { row: S.form.row, guard: r ? r.risiko : undefined, tgl: r ? r.tgl : today(), risiko: String(f.get('risiko')).trim(), kat: f.get('kat'), p: +f.get('p'), d: +f.get('d'), langkah: String(f.get('langkah')).trim(), pj: String(f.get('pj') || '').trim(), target: f.get('target') || '', status: f.get('status'), catatan: String(f.get('catatan') || '').trim() };
  },
  savePredBlok: f => ({ blok: S.form.blok, tanam: f.get('tanam') || '', rumpun: parseNum(f.get('rumpun')), catatan: String(f.get('catatan') || '').trim() }),
  savePredEst: f => { need(f.get('porsi'), 'Pilih porsi blok.'); return { row: S.form.row, blok: f.get('blok'), porsi: +f.get('porsi'), bulan: f.get('bulan'), catatan: String(f.get('catatan') || '').trim() }; },
  saveUser: f => ({ isNew: S.form.isNew, username: String(f.get('username') || '').trim().toLowerCase(), nama: String(f.get('nama') || '').trim(), role: f.get('role'), aktif: S.form.isNew ? true : !!f.get('aktif'), email: String(f.get('email') || '').trim(), password: String(f.get('password') || '') })
};

// ---------- Event ----------
const ACT = {
  nav: t => { S.view = t.dataset.v; closeSheet(); renderView(); window.scrollTo(0, 0); },
  homeTab: t => { S.homeTab = t.dataset.v; renderView(); },
  mutTab: t => { S.mutTab = t.dataset.v; renderView(); },
  kasKat: t => { S.kasF.kat = t.dataset.v; if (!t.dataset.v) S.kasF.noBukti = false; renderView(); },
  kasNoBukti: () => { S.kasF.noBukti = !S.kasF.noBukti; renderView(); },
  panJenis: t => { S.panF.jenis = t.dataset.v; renderView(); },
  lahanBlok: t => { S.lahanF.blok = t.dataset.v; renderView(); },
  mitStatus: t => { S.mitF.status = t.dataset.v; renderView(); },
  kasDetail: t => kasDetail(+t.dataset.row),
  jualDetail: t => jualDetail(+t.dataset.row),
  prodDetail: t => prodDetail(+t.dataset.row),
  openInput: () => openInputChooser(),
  form: t => openForm(t.dataset.v, t.dataset.row ? +t.dataset.row : null, { keg: t.dataset.keg }),
  closeSheet: () => closeSheet(),
  rmPhoto: t => { S.form.photos.splice(+t.dataset.i, 1); renderPhotos(); },
  askDelete: t => { $('#delBox').innerHTML = `<div class="confirm"><p>Hapus data ini dari spreadsheet? Tindakan tercatat di Log Aktivitas.</p><div class="btn-row"><button class="btn ghost sm" data-act="cancelDelete">Batal</button><button class="btn danger sm" data-act="doDelete" data-v="${t.dataset.v}" data-row="${t.dataset.row}">Ya, hapus</button></div></div>`; $('#delBox').scrollIntoView({ block: 'nearest' }); },
  cancelDelete: () => { $('#delBox').innerHTML = ''; },
  doDelete: async t => {
    const kind = t.dataset.v, row = +t.dataset.row;
    const rec = (kind === 'kas' ? S.C.kas : kind === 'jual' ? S.C.jual : kind === 'prod' ? S.C.prod : S.D.mit).find(x => x.row === row);
    const guard = kind === 'kas' ? rec.ket : kind === 'jual' ? rec.kg : kind === 'prod' ? rec.kejadian : rec.risiko;
    t.disabled = true; t.textContent = 'Menghapus…';
    try { await call('deleteRow', { sheet: kind, row, guard }); closeSheet(); await refresh('Data dihapus'); }
    catch (e) { $('#delBox').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  },
  refresh: async t => { t.disabled = true; await refresh('Data diperbarui'); },
  logout: () => signOut(),
  demoLogin: async t => { try { await doLogin(t.dataset.u, 'demo', true); } catch (e) { $('#loginErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; } },
  userForm: t => userForm(t.dataset.u),
  openFeed: () => openFeed(),
  lahanTab: t => { S.lahanTab = t.dataset.v; renderView(); },
  goPred: () => { S.view = 'lahan'; S.lahanTab = 'pred'; renderView(); window.scrollTo(0, 0); },
  predBlok: t => predBlokForm(t.dataset.b),
  predEst: t => predEstForm(t.dataset.b, t.dataset.row ? +t.dataset.row : null),
  delPredEst: async t => { t.disabled = true; try { await call('deletePredEst', { row: +t.dataset.row }); closeSheet(); await refresh('Estimasi dihapus'); } catch (e) { $('#formErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; t.disabled = false; } },
  openReport: () => openReport(),
  askSendReport: t => { $('#repBox').innerHTML = `<div class="confirm" style="background:var(--accent-soft)"><p style="color:var(--accent-ink)">Kirim laporan ${mLong(t.dataset.m)} ke semua investor yang emailnya terdaftar, dengan lampiran PDF?</p><div class="btn-row"><button class="btn ghost sm" data-act="cancelSend">Batal</button><button class="btn accent sm" data-act="sendReport" data-m="${t.dataset.m}">Ya, kirim</button></div></div>`; },
  cancelSend: () => { $('#repBox').innerHTML = ''; },
  sendReport: async t => {
    const label = t.textContent; t.disabled = true; t.textContent = 'Mengirim…';
    try { const r = await call('sendReport', { month: t.dataset.m, test: t.dataset.test === '1', note: ($('#repNote') || {}).value || '' }); $('#repBox').innerHTML = ''; toast('Terkirim ke ' + r.to.join(', ')); }
    catch (e) { $('#repBox').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    t.disabled = false; t.textContent = label;
  },
  enablePush: t => enablePush(t),
  disablePush: () => disablePush(),
  testPush: async t => { t.disabled = true; try { await call('testPush'); toast('Notifikasi uji dikirim'); } catch (e) { toast(e.message); } t.disabled = false; },
  saveSrv: () => {
    const v = String($('#srvUrl').value || '').trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v)) { $('#loginErr').innerHTML = '<div class="err">Alamat harus berbentuk https://script.google.com/macros/s/…/exec</div>'; return; }
    store.set('qdf_api', v); location.reload();
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (!f) return;
  if (t.tagName === 'A') return;
  e.preventDefault();
  if (['nav', 'openInput', 'homeTab', 'mutTab', 'form'].includes(t.dataset.act)) buzz();
  f(t, e);
});
// Tarik ke bawah untuk memuat ulang
(function () {
  let y0 = null, d = 0;
  const sheetOpen = () => { const s = document.getElementById('sheet'); return s && !s.hidden; };
  window.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && S.D && !sheetOpen()) ? e.touches[0].clientY : null; d = 0; }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (y0 === null) return;
    d = Math.max(0, e.touches[0].clientY - y0);
    const el = document.getElementById('ptr'); if (!el) return;
    el.style.transform = `translateY(${Math.min(d * .45, 64)}px) rotate(${d * 2.2}deg)`;
    el.style.opacity = Math.min(1, d / 90);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 === null) return;
    const el = document.getElementById('ptr'), go = d > 120; y0 = null; d = 0;
    if (!el) return;
    if (go) { buzz(); el.classList.add('spinning'); el.style.transform = 'translateY(40px)'; await refresh('Data diperbarui'); }
    el.classList.remove('spinning'); el.style.transition = 'transform .3s, opacity .3s'; el.style.transform = ''; el.style.opacity = 0;
    setTimeout(() => { el.style.transition = ''; }, 320);
  });
})();
document.addEventListener('submit', async e => {
  const form = e.target; e.preventDefault();
  const on = form.dataset.on;
  if (on === 'login') {
    const f = new FormData(form), btn = $('button[type="submit"]', form), box = $('#loginErr');
    box.innerHTML = ''; btn.disabled = true; btn.textContent = 'Memeriksa…';
    try { await doLogin(String(f.get('username')).trim(), f.get('password'), !!f.get('remember')); }
    catch (err) { box.innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; btn.textContent = 'Masuk'; if (err.net && $('#srvBox')) $('#srvBox').open = true; }
    return;
  }
  if (on === 'changePw') {
    const f = new FormData(form), box = $('#pwErr'), btn = $('button[type="submit"]', form);
    box.innerHTML = ''; btn.disabled = true;
    try { await call('changePassword', { oldPassword: f.get('oldPassword'), newPassword: f.get('newPassword') }); form.reset(); toast('Password diganti'); }
    catch (err) { box.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
    btn.disabled = false; return;
  }
  if (on === 'saveUser') { return submitForm(form, 'saveUser', FORMS.saveUser).then(() => { if (S.view === 'akun') loadUsers(); }); }
  if (FORMS[on]) submitForm(form, on, FORMS[on]);
});
document.addEventListener('input', e => {
  const t = e.target, on = t.dataset.on;
  if (on === 'kasQ') { S.kasF.q = t.value; const pos = t.selectionStart; renderView(); const n = $('#kq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
  if (on === 'fmtNum') { const v = parseNum(t.value); t.value = v ? nf.format(v) : ''; }
  const form = t.form;
  if (form && form.dataset.on === 'saveJual') { const f = new FormData(form); $('#f-total').textContent = rp(parseNum(f.get('kg')) * parseNum(f.get('harga'))); }
});
document.addEventListener('change', async e => {
  const t = e.target, on = t.dataset.on, form = t.form;
  if (on === 'kasBulan') { S.kasF.bulan = t.value; renderView(); return; }
  if (on === 'pickPhoto') {
    const files = [...t.files]; t.value = '';
    for (const f of files) { try { const data = await compress(f); S.form.photos.push({ kind: 'new', data, name: f.name.replace(/\.\w+$/, '') + '.jpg' }); } catch (err) { toast(err.message); } }
    renderPhotos(); return;
  }
  if (form && form.dataset.on === 'saveKas' && t.name === 'jenis') { $('#f-kat').innerHTML = katOptions(t.value); }
  if (form && form.dataset.on === 'saveProd' && t.name === 'keg') { $('#panenField').hidden = t.value !== 'Panen'; }
  if (form && form.dataset.on === 'saveMit' && (t.name === 'p' || t.name === 'd')) { const f = new FormData(form), s = f.get('p') * f.get('d'); $('#f-skor').textContent = s + ' · ' + lvl(s)[0]; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('Foto tidak bisa dibaca.'));
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => rej(new Error('Format foto tidak didukung. Gunakan JPG atau PNG.'));
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

boot();
