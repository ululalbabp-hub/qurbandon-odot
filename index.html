<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qurbandong Odot</title>
<meta name="theme-color" content="#1d4a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QDF Odot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js?v=4"></script>
</head>
<body>
<title>Qurbandong Odot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d4a30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>

:root{
  --bg:#eef1ea; --surface:#fbfcf9; --surface-2:#e3e9dd; --ink:#16241b; --ink-2:#4f5e53; --ink-3:#7b887e; --line:#d3dacb;
  --hero:#1d4a30; --hero-ink:#f3f7f0; --hero-2:#a8c6a1; --hero-track:rgba(255,255,255,.16);
  --accent:#c48a1c; --accent-soft:#f4e5c2; --accent-ink:#5a3d05;
  --pos:#23784a; --neg:#b2392a; --warn:#9a6205; --info:#2f6690;
  --pos-soft:#dcefdf; --neg-soft:#f7ded9; --warn-soft:#f6e8c8; --info-soft:#dce9f3;
  --c-in:#3f8f5a; --c-out:#c8714f; --c-line:#1d4a30; --c-target:#cfd8c7;
  --scrim:rgba(14,22,16,.45);
  --shadow:0 1px 2px rgba(22,36,27,.05),0 6px 20px rgba(22,36,27,.07);
  --f-display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1510; --surface:#151f18; --surface-2:#1d2a21; --ink:#e3eae2; --ink-2:#a6b3a8; --ink-3:#77857a; --line:#29372d;
  --hero:#183622; --hero-ink:#eef4ec; --hero-2:#93b38d; --hero-track:rgba(255,255,255,.12);
  --accent:#e2ac46; --accent-soft:#3a2f16; --accent-ink:#f4d79a;
  --pos:#6cc38a; --neg:#ef7f6c; --warn:#e3a842; --info:#80b3dc;
  --pos-soft:#17301f; --neg-soft:#3b1f1a; --warn-soft:#3a2f16; --info-soft:#172a3a;
  --c-in:#62b47e; --c-out:#e08a68; --c-line:#cfe3c9; --c-target:#2b3a2f;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1510; --surface:#151f18; --surface-2:#1d2a21; --ink:#e3eae2; --ink-2:#a6b3a8; --ink-3:#77857a; --line:#29372d;
  --hero:#183622; --hero-ink:#eef4ec; --hero-2:#93b38d; --hero-track:rgba(255,255,255,.12);
  --accent:#e2ac46; --accent-soft:#3a2f16; --accent-ink:#f4d79a;
  --pos:#6cc38a; --neg:#ef7f6c; --warn:#e3a842; --info:#80b3dc;
  --pos-soft:#17301f; --neg-soft:#3b1f1a; --warn-soft:#3a2f16; --info-soft:#172a3a;
  --c-in:#62b47e; --c-out:#e08a68; --c-line:#cfe3c9; --c-target:#2b3a2f;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0}


.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:380px;display:grid;gap:20px}
.login-brand{display:flex;gap:14px;align-items:center}
.login-brand .logo{width:64px;height:64px;flex:none;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
.login-brand h1{font-size:26px;line-height:1.1}
.login-brand p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.login form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.demo-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login-foot{font-size:12.5px;color:var(--ink-3);text-align:center}


body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .logo{width:34px;height:34px;flex:none;border-radius:9px;background:#fff}
.srv{font-size:13px;color:var(--ink-2)}
.srv summary{cursor:pointer;font-weight:600}
.srv-in{display:grid;gap:8px;margin-top:8px}
.srv-in .inp{font-size:13px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-family:var(--f-display);font-size:17px;font-weight:800}
.brand-t span{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.avatar{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px}
.role-pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.demo-bar{background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;text-align:center;padding:6px 16px}
main.wrap{max-width:600px;margin:0 auto;padding-top:18px;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav-in{max-width:600px;margin:0 auto;display:flex;height:var(--nav-h);align-items:stretch}
.bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);min-width:0}
.bnav button[aria-current="page"]{color:var(--hero)}
:root[data-theme="dark"] .bnav button[aria-current="page"]{color:var(--hero-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bnav button[aria-current="page"]{color:var(--hero-2)}}
.bnav .fab-slot{flex:1;display:grid;place-items:center}
.fab{width:52px;height:52px;border-radius:16px;border:none;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(196,138,28,.35);transform:translateY(-10px)}
.fab .ic svg{width:26px;height:26px;stroke-width:2.2}


.intro h1{font-size:25px;line-height:1.15;margin-top:4px}
.intro p{margin:6px 0 0;font-size:13.5px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px 20px 18px;display:grid;gap:14px}
.hero-lbl{font-size:12.5px;color:var(--hero-2);font-weight:600;letter-spacing:.02em}
.hero-num{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:2px}
.hero-sub{font-size:13px;color:var(--hero-2);margin-top:4px;max-width:32ch}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(239,127,108,.22);color:#ffd2c9;margin-top:8px}
.plafon{display:grid;gap:6px;position:relative;z-index:1}
.pl-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}
.pl-row.sm{font-size:12px;color:var(--hero-2)}
.bar{height:10px;border-radius:99px;background:var(--hero-track);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.blades{position:absolute;right:-6px;top:-4px;width:150px;height:110px;opacity:.22;pointer-events:none}
.blades path{fill:none;stroke:var(--hero-2);stroke-width:2.4;stroke-linecap:round}
.sec{display:grid;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:18px}
.link{border:none;background:none;color:var(--info);font-weight:600;font-size:13px;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px 6px;font-size:13.5px;font-weight:600;color:var(--ink-2);min-width:0}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--ink-3)}
.v.neg,.negc{color:var(--neg)} .v.pos,.posc{color:var(--pos)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.panel h3{font-size:15.5px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1}
.hb{display:grid;gap:10px}
.hb-row{display:grid;gap:5px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.hb-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c-out)}
.track.green i{background:var(--c-in)}
.track.gold i{background:var(--accent)}
.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv div:last-child{border-bottom:none}
.kv span{color:var(--ink-2)}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0}


.sigs{display:grid;gap:8px}
.sig{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:12px;padding:11px 12px}
.sig .ic{color:var(--sev);margin-top:1px}
.sig b{display:block;font-size:14px;line-height:1.35}
.sig p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
.sev-crit{--sev:var(--neg)} .sev-warn{--sev:var(--warn)} .sev-info{--sev:var(--info)} .sev-ok{--sev:var(--pos)}


.filters{display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:16px}
.search .ic{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px;padding-left:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumrow div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.sumrow span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.sumrow b{font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.group{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.group-h span{font-weight:600;font-variant-numeric:tabular-nums}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:12px 14px;border-top:1px solid var(--line)}
.group-h + .tx{border-top:none}
.tx:active{background:var(--surface-2)}
.tx-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.tx-ic.in{background:var(--pos-soft);color:var(--pos)}
.tx-ic.out{background:var(--neg-soft);color:var(--neg)}
.tx-ic.harv{background:var(--accent-soft);color:var(--accent-ink)}
.tx-ic.prod{background:var(--info-soft);color:var(--info)}
.tx-main{min-width:0;display:grid;gap:2px}
.tx-t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.tx-m{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx-m .ic svg{width:14px;height:14px}
.tx-amt{text-align:right;display:grid;gap:1px}
.tx-amt b{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt small{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--pos-soft);color:var(--pos)}
.tag.crit{background:var(--neg-soft);color:var(--neg)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.mute{background:var(--surface-2);color:var(--ink-2)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty b{font-family:var(--f-display);font-size:16px}
.empty p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:40ch}


.blok-list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.blok{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.blok:first-child{border-top:none}
.blok-badge{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--hero)}
:root[data-theme="dark"] .blok-badge{color:var(--hero-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blok-badge{color:var(--hero-2)}}
.blok-main{display:grid;gap:5px;min-width:0}
.blok-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.blok-top b{font-size:14px}
.tl{display:grid;gap:0}
.tl-item{display:grid;grid-template-columns:58px 1fr;gap:12px;width:100%;text-align:left;border:none;background:none;padding:0}
.tl-date{font-size:12px;color:var(--ink-3);text-align:right;padding-top:13px;font-variant-numeric:tabular-nums;line-height:1.25}
.tl-date b{display:block;font-size:17px;color:var(--ink);font-family:var(--f-display)}
.tl-card{border-left:2px solid var(--line);padding:10px 0 14px 14px;position:relative;display:grid;gap:5px;min-width:0}
.tl-card::before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--sev,var(--ink-3));border:2px solid var(--bg)}
.tl-card .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tl-card .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}


.matrix-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:stretch}
.mx-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--ink-3);text-align:center;font-weight:600}
.matrix{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.mx{aspect-ratio:1.25;max-width:100%;border-radius:6px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:2px}
.mx.lo{background:var(--pos-soft)} .mx.md{background:var(--warn-soft)} .mx.hi{background:var(--neg-soft)}
.mx span{font-size:9px;font-weight:800;background:var(--surface);border-radius:4px;padding:1px 3px;color:var(--ink)}
.mx-x{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;font-size:10px;color:var(--ink-3);text-align:center;margin-top:3px}
.mx-cap{font-size:11px;color:var(--ink-3);text-align:center;font-weight:600;margin-top:2px}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.risk-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.risk-id{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--ink-2)}
.risk h3{font-size:15.5px;line-height:1.35}
.steps{margin:0;padding-left:20px;display:grid;gap:5px;font-size:13.5px}
.steps li::marker{color:var(--accent);font-weight:700}
.risk-f{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:9px;align-items:center}
.risk-f .sp{flex:1}
.score{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:15px}
.btn.primary{background:var(--hero);color:var(--hero-ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.block{width:100%}

// ---------- Sinyal otomatis (dasar mitigasi) ----------
function signals(C, D) {
  const out = [], t = C.today;
  if (C.saldo < 0) out.push({ sev: 'crit', t: 'Saldo kas minus ' + rp(-C.saldo), d: 'Pengeluaran ' + rpS(C.totOut) + ' melebihi kas masuk ' + rpS(C.totIn) + '. Selisih saat ini ditalangi; perlu pencairan modal atau penundaan belanja.' });
  if (C.targetToDate > 0) {
    const r = C.panenKg / C.targetToDate;
    if (r < .8) out.push({ sev: r < .5 ? 'crit' : 'warn', t: 'Panen ' + kg(C.panenKg) + ' dari target ' + kg(C.targetToDate), d: 'Target kumulatif proposal sampai ' + mLong(C.thisMonth) + '. Capaian ' + pct(r) + '.' });
  }
  if (C.lastProd) {
    const g = daysBetween(C.lastProd, t);
    if (g > 7) out.push({ sev: g > 30 ? 'crit' : 'warn', t: 'Catatan lapangan terakhir ' + dLong(C.lastProd), d: g + ' hari tanpa laporan kegiatan. Kesepakatan: update minimal 1× per minggu.' });
  } else out.push({ sev: 'warn', t: 'Belum ada catatan kegiatan lapangan', d: 'Catat kegiatan tanam, pemupukan, dan panen per blok.' });
  if (C.lastKas && daysBetween(C.lastKas, t) > 14) out.push({ sev: 'warn', t: 'Transaksi kas terakhir ' + dLong(C.lastKas), d: daysBetween(C.lastKas, t) + ' hari tanpa transaksi tercatat. Pastikan semua belanja sudah diinput.' });
  if (C.noBukti.length) out.push({ sev: 'warn', t: C.noBukti.length + ' dari ' + C.kas.length + ' transaksi kas belum punya bukti', d: 'Total ' + rpS(sum(C.noBukti, k => k.keluar + k.masuk)) + '. Unggah foto nota/kuitansi lewat menu Mutasi.', act: 'filterNoBukti' });
  const dupMap = {}; C.kas.forEach(k => { const key = k.kat + '|' + (k.masuk || 0) + '|' + (k.keluar || 0) + '|' + k.ket.toLowerCase().replace(/[^a-z0-9]/g, ''); (dupMap[key] = dupMap[key] || []).push(k); });
  Object.values(dupMap).filter(a => a.length > 1).forEach(a => out.push({ sev: 'warn', t: 'Kemungkinan entri ganda: ' + a[0].ket.trim(), d: a.length + '× ' + rp(a[0].keluar || a[0].masuk) + ' pada ' + a.map(k => dLong(k.tgl)).join(', ') + '. Pastikan memang dua pembayaran berbeda.' }));
  C.prod.filter(p => p.status === 'Proses' && p.tgl && daysBetween(p.tgl, t) > 14).forEach(p => out.push({ sev: p.keparahan === 'Tinggi' ? 'crit' : 'warn', t: p.keg + ' ' + p.blok + ' masih "Proses" sejak ' + dLong(p.tgl), d: (p.kejadian || '') + '. Perbarui status atau tindak lanjutnya.' }));
  if (C.piutang > 0) out.push({ sev: 'warn', t: 'Piutang penjualan ' + rp(C.piutang), d: 'Penjualan berstatus Belum Lunas.' });
  if (C.plafonUsed > .85) out.push({ sev: 'warn', t: 'Plafon modal terpakai ' + pct(C.plafonUsed), d: 'Sisa ' + rpS(C.cfg.PLAFON - C.modal) + ' dari plafon ' + rpS(C.cfg.PLAFON) + '.' });
  D.mit.filter(m => m.target && m.target < t && m.status !== 'Selesai').forEach(m => out.push({ sev: 'info', t: m.id + ' melewati target ' + dLong(m.target), d: m.risiko }));
  const rank = { crit: 0, warn: 1, info: 2 };
  out.sort((a, b) => rank[a.sev] - rank[b.sev]);

}
const sigHtml = s => `<div class="sig sev-${s.sev}">${ic(s.sev === 'crit' ? 'alert' : s.sev === 'warn' ? 'info' : s.sev === 'ok' ? 'check' : 'info')}<div><b>${esc(s.t)}</b><p>${esc(s.d)}</p></div></div>`;

// ---------- Grafik SVG ----------
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function shortN(v, unit) { const a = Math.abs(v), s = v < 0 ? '−' : ''; if (unit === 'kg') return s + (a >= 1000 ? nf1.format(a / 1000) + 't' : nf.format(a)); if (a >= 1e6) return s + nf1.format(a / 1e6) + 'jt'; if (a >= 1e3) return s + nf1.format(a / 1e3) + 'rb'; return s + nf.format(a); }
function cashChart(rows) {
  const W = 340, H = 196, L = 40, R = 8, T = 10, B = 26;
  const hiV = Math.max(...rows.map(r => Math.max(r.in, r.out, r.saldo)), 1), loV = Math.min(0, ...rows.map(r => r.saldo));
  const step = niceMax((hiV - loV) / 4), top = Math.ceil(hiV / step) * step, bot = Math.floor(loV / step) * step;
  const y = v => T + (top - v) / (top - bot) * (H - T - B);
  const cw = (W - L - R) / rows.length, bw = Math.max(2, Math.min(16, cw * .32));
  let g = '';
  for (let v = bot; v <= top + 1e-6; v += step) g += `<line class="${Math.abs(v) < 1e-6 ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${shortN(v)}</text>`;
  const every = Math.ceil(rows.length / 8);
  rows.forEach((r, i) => {
    const cx = L + cw * i + cw / 2;
    g += `<rect x="${cx - bw - 1}" y="${y(Math.max(r.in, 0))}" width="${bw}" height="${Math.max(0, y(0) - y(r.in))}" rx="2" fill="var(--c-in)"><title>${mLong(r.m)} masuk ${rp(r.in)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(r.out)}" width="${bw}" height="${Math.max(0, y(0) - y(r.out))}" rx="2" fill="var(--c-out)"><title>${mLong(r.m)} keluar ${rp(r.out)}</title></rect>`;
    if (i % every === 0 || i === rows.length - 1) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${mLabel(r.m)}</text>`;
  });
  const pts = rows.map((r, i) => [L + cw * i + cw / 2, y(r.saldo)]);
  g += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--c-line)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => g += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4.5 : 3}" fill="var(--surface)" stroke="var(--c-line)" stroke-width="2"><title>Saldo akhir ${mLong(rows[i].m)}: ${rp(rows[i].saldo)}</title></circle>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik arus kas bulanan">${g}</svg>`;
}
function harvestChart(rows) {
  const W = 340, H = 186, L = 34, R = 8, T = 10, B = 26;
  const hi = Math.max(...rows.map(r => Math.max(r.target, r.panen, r.jual)), 1);
  const step = niceMax(hi / 4), top = Math.ceil(hi / step) * step;
  const y = v => T + (top - v) / top * (H - T - B);
  const cw = (W - L - R) / rows.length, bw = Math.max(4, cw * .62);
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line class="${v === 0 ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${shortN(v, 'kg')}</text>`;
  rows.forEach((r, i) => {
    const cx = L + cw * i + cw / 2;
    if (r.target) g += `<rect x="${cx - bw / 2}" y="${y(r.target)}" width="${bw}" height="${y(0) - y(r.target)}" rx="3" fill="var(--c-target)"><title>${mLong(r.m)} target ${kg(r.target)}</title></rect>`;
    if (r.panen) g += `<rect x="${cx - bw * .3}" y="${y(r.panen)}" width="${bw * .6}" height="${y(0) - y(r.panen)}" rx="2" fill="var(--accent)"><title>${mLong(r.m)} panen ${kg(r.panen)}</title></rect>`;
    if (i % 2 === 0) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${mLabel(r.m)}</text>`;

}

const lvl = s => s >= 15 ? ['Tinggi', 'crit', 'var(--neg)'] : s >= 8 ? ['Sedang', 'warn', 'var(--warn)'] : ['Rendah', 'ok', 'var(--pos)'];
function viewMitigasi() {
  const C = S.C, D = S.D, sig = signals(C, D), F = S.mitF;
  const mit = D.mit.slice().sort((a, b) => (a.status === 'Selesai') - (b.status === 'Selesai') || b.p * b.d - a.p * a.d);
  const list = mit.filter(m => !F.status || m.status === F.status);
  let cells = '';
  for (let p = 5; p >= 1; p--) for (let d = 1; d <= 5; d++) {
    const s = p * d, ids = D.mit.filter(m => m.p === p && m.d === d && m.status !== 'Selesai').map(m => `<span>${esc(m.id)}</span>`).join('');
    cells += `<div class="mx ${s >= 15 ? 'hi' : s >= 8 ? 'md' : 'lo'}" title="Kemungkinan ${p} × Dampak ${d} = ${s}">${ids}</div>`;
  }
  const statuses = C.cfg.STATUS_MIT;
  return `<section class="intro"><p class="eyebrow">Risiko & langkah penanganan</p><h1>Mitigasi</h1>
    <p class="muted">Sinyal dibaca otomatis dari data kas, panen, dan kegiatan. Register risiko diisi pengelola.</p></section>
  <section class="sec"><div class="sec-h"><h2>Sinyal otomatis</h2><span class="small muted">${sig.length} sinyal</span></div>
    <div class="sigs">${sig.length ? sig.map(sigHtml).join('') : sigHtml({ sev: 'ok', t: 'Semua indikator aman', d: 'Tidak ada sinyal risiko dari data saat ini.' })}</div></section>
  <div class="panel"><div class="ph"><h3>Peta risiko</h3><span class="small muted">risiko aktif</span></div>
    <div class="matrix-wrap"><div class="mx-y">Kemungkinan →</div><div><div class="matrix">${cells}</div><div class="mx-x"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><div class="mx-cap">Dampak →</div></div></div></div>
  <section class="sec"><div class="sec-h"><h2>Register risiko</h2>${isAdmin() ? `<button class="btn accent sm" data-act="form" data-v="mit">${ic('plus')} Risiko</button>` : ''}</div>
    <div class="chips"><button class="chip" aria-pressed="${!F.status}" data-act="mitStatus" data-v="">Semua (${mit.length})</button>${statuses.map(s => `<button class="chip" aria-pressed="${F.status === s}" data-act="mitStatus" data-v="${s}">${s} (${mit.filter(m => m.status === s).length})</button>`).join('')}</div>
    ${list.length ? list.map(riskCard).join('') : '<div class="empty"><b>Belum ada risiko di status ini</b></div>'}</section>`;
}
function riskCard(m) {
  const s = m.p * m.d, [L, cls, col] = lvl(s);
  const steps = String(m.langkah || '').split(/\n+/).map(x => x.replace(/^\s{0,}(\d+[.)]|[-•])\s{0,}/, '').trim()).filter(Boolean);
  const overdue = m.target && m.target < S.C.today && m.status !== 'Selesai';
  const stCls = m.status === 'Selesai' ? 'ok' : m.status === 'Berjalan' ? 'info' : m.status === 'Dipantau' ? 'mute' : 'warn';
  return `<article class="risk"><div class="risk-h"><span class="risk-id">${esc(m.id)}</span><span class="tag ${cls}">${L} · ${s}</span><span class="tag mute">${esc(m.kat)}</span><span class="tag ${stCls}">${esc(m.status)}</span></div>
    <h3>${esc(m.risiko)}</h3>
    <ol class="steps">${steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    ${m.catatan ? `<p class="note"><b>Progres:</b> ${esc(m.catatan)}</p>` : ''}
    <div class="risk-f"><span>PJ: <b>${esc(m.pj || '—')}</b></span><span class="${overdue ? 'negc' : ''}">Target: <b>${dLong(m.target)}</b>${overdue ? ' · lewat' : ''}</span><span class="sp"></span>${isAdmin() ? `<button class="btn ghost sm" data-act="form" data-v="mit" data-row="${m.row}">${ic('edit')} Ubah</button>` : ''}</div></article>`;
}

function openSheet(html) { const s = $('#sheet'); $('#sheetBody').innerHTML = html; setTimeout(hydrateMedia, 0); s.hidden = false; document.body.style.overflow = 'hidden'; $('.sheet', s).scrollTop = 0; }

const driveIdOf = u => { const m = String(u).match(/\/d\/([\w-]{20,})/) || String(u).match(/[?&]id=([\w-]{20,})/); return m ? m[1] : ''; };
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const MEDIA = new Map();
function hydrateMedia() {
  document.querySelectorAll('img[data-drive]:not([data-ok])').forEach(img => {
    const id = img.dataset.drive; img.dataset.ok = '1';
    const thumb = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1200';
    if (DEMO) { img.src = thumb; return; }
    if (MEDIA.has(id)) { img.src = MEDIA.get(id); return; }
    call('media', { id }).then(r => { MEDIA.set(id, r.data); document.querySelectorAll('img[data-drive="' + id + '"]').forEach(x => { x.src = r.data; }); })
      .catch(() => { img.src = thumb; });
  });
}
const imgTag = (u, cls, alt) => { const id = /^data:/.test(u) ? '' : driveIdOf(u); return id ? `<img class="${cls || ''}" src="${BLANK}" data-drive="${id}" alt="${alt || ''}" loading="lazy">` : `<img class="${cls || ''}" src="${esc(u)}" alt="${alt || ''}" loading="lazy">`; };

async function uploadPhotos() {
  const out = [], list = S.form.photos, btn = $('#sheetBody button[type="submit"]');
  let n = 0; const total = list.filter(p => p.kind === 'new').length;
  for (const p of list) {
    if (p.kind === 'url') { out.push(p.url); continue; }
    n++; if (btn) btn.textContent = `Mengunggah foto ${n}/${total}…`;
    const r = await call('upload', { data: p.data, mime: 'image/jpeg', name: p.name });
    p.kind = 'url'; p.url = r.url; out.push(r.url);
  }
  return out;
}
async function submitForm(form, action, build) {
  if (S.busy) return;
  const btn = $('button[type="submit"]', form), err = $('#formErr'), label = btn.textContent;
  err.innerHTML = '';
  let payload;
  try { payload = build(new FormData(form)); } catch (e) { err.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  S.busy = true; btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    if (S.form && S.form.photos) payload.foto = await uploadPhotos();
    btn.textContent = 'Menyimpan…';
    await call(action, payload);
    closeSheet(); await refresh('Tersimpan ke spreadsheet');
  } catch (e) { err.innerHTML = `<div class="err">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = label; }
  finally { S.busy = false; }
}

    const kgv = parseNum(f.get('kg')), hg = parseNum(f.get('harga')), r = S.form.rec;
    need(kgv > 0, 'Isi kg terjual.'); need(hg > 0, 'Isi harga per kg.');
    return { row: S.form.row, guard: r ? r.kg : undefined, tgl: f.get('tgl'), blok: f.get('blok'), kg: kgv, harga: hg, pembeli: String(f.get('pembeli') || '').trim(), status: f.get('status'), catatan: String(f.get('catatan') || '').trim(), catatKas: !!f.get('catatKas') };
  },
  saveProd: f => {
    const keg = f.get('keg'), pn = parseNum(f.get('panen')), r = S.form.rec;
    need(keg !== 'Panen' || pn > 0, 'Isi hasil panen (kg).'); need(String(f.get('kejadian')).trim(), 'Isi uraian kegiatan.');
    return { row: S.form.row, guard: r ? r.kejadian : undefined, tgl: f.get('tgl'), blok: f.get('blok'), keg, panen: keg === 'Panen' ? pn : (pn || 0), kejadian: String(f.get('kejadian')).trim(), keparahan: f.get('keparahan'), tindak: String(f.get('tindak') || '').trim(), status: f.get('status') };
  },
  saveMit: f => {
    const r = S.form.rec;
    need(String(f.get('risiko')).trim(), 'Isi uraian risiko.'); need(String(f.get('langkah')).trim(), 'Isi minimal satu langkah mitigasi.');
    return { row: S.form.row, guard: r ? r.risiko : undefined, tgl: r ? r.tgl : today(), risiko: String(f.get('risiko')).trim(), kat: f.get('kat'), p: +f.get('p'), d: +f.get('d'), langkah: String(f.get('langkah')).trim(), pj: String(f.get('pj') || '').trim(), target: f.get('target') || '', status: f.get('status'), catatan: String(f.get('catatan') || '').trim() };
  },
  saveUser: f => ({ isNew: S.form.isNew, username: String(f.get('username') || '').trim().toLowerCase(), nama: String(f.get('nama') || '').trim(), role: f.get('role'), aktif: S.form.isNew ? true : !!f.get('aktif'), password: String(f.get('password') || '') })
};

// ---------- Event ----------
const ACT = {
  nav: t => { S.view = t.dataset.v; closeSheet(); renderView(); window.scrollTo(0, 0); },
  homeTab: t => { S.homeTab = t.dataset.v; renderView(); },
  mutTab: t => { S.mutTab = t.dataset.v; renderView(); },
  kasKat: t => { S.kasF.kat = t.dataset.v; if (!t.dataset.v) S.kasF.noBukti = false; renderView(); },
  kasNoBukti: () => { S.kasF.noBukti = !S.kasF.noBukti; renderView(); },
  panJenis: t => { S.panF.jenis = t.dataset.v; renderView(); },
  lahanBlok: t => { S.lahanF.blok = t.dataset.v; renderView(); },
  mitStatus: t => { S.mitF.status = t.dataset.v; renderView(); },
  kasDetail: t => kasDetail(+t.dataset.row),
  jualDetail: t => jualDetail(+t.dataset.row),
  prodDetail: t => prodDetail(+t.dataset.row),
  openInput: () => openInputChooser(),
  form: t => openForm(t.dataset.v, t.dataset.row ? +t.dataset.row : null, { keg: t.dataset.keg }),
  closeSheet: () => closeSheet(),
  rmPhoto: t => { S.form.photos.splice(+t.dataset.i, 1); renderPhotos(); },
  askDelete: t => { $('#delBox').innerHTML = `<div class="confirm"><p>Hapus data ini dari spreadsheet? Tindakan tercatat di Log Aktivitas.</p><div class="btn-row"><button class="btn ghost sm" data-act="cancelDelete">Batal</button><button class="btn danger sm" data-act="doDelete" data-v="${t.dataset.v}" data-row="${t.dataset.row}">Ya, hapus</button></div></div>`; $('#delBox').scrollIntoView({ block: 'nearest' }); },
  cancelDelete: () => { $('#delBox').innerHTML = ''; },
  doDelete: async t => {
    const kind = t.dataset.v, row = +t.dataset.row;
    const rec = (kind === 'kas' ? S.C.kas : kind === 'jual' ? S.C.jual : kind === 'prod' ? S.C.prod : S.D.mit).find(x => x.row === row);
    const guard = kind === 'kas' ? rec.ket : kind === 'jual' ? rec.kg : kind === 'prod' ? rec.kejadian : rec.risiko;
    t.disabled = true; t.textContent = 'Menghapus…';
    try { await call('deleteRow', { sheet: kind, row, guard }); closeSheet(); await refresh('Data dihapus'); }
    catch (e) { $('#delBox').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  },
  refresh: async t => { t.disabled = true; await refresh('Data diperbarui'); },
  logout: () => signOut(),
  demoLogin: async t => { try { await doLogin(t.dataset.u, 'demo', true); } catch (e) { $('#loginErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; } },
  userForm: t => userForm(t.dataset.u),
  saveSrv: () => {
    const v = String($('#srvUrl').value || '').trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v)) { $('#loginErr').innerHTML = '<div class="err">Alamat harus berbentuk https://script.google.com/macros/s/…/exec</div>'; return; }
    store.set('qdf_api', v); location.reload();
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (!f) return;
  if (t.tagName === 'A') return;
  e.preventDefault(); f(t, e);
});
document.addEventListener('submit', async e => {
  const form = e.target; e.preventDefault();
  const on = form.dataset.on;
  if (on === 'login') {
    const f = new FormData(form), btn = $('button[type="submit"]', form), box = $('#loginErr');
    box.innerHTML = ''; btn.disabled = true; btn.textContent = 'Memeriksa…';
    try { await doLogin(String(f.get('username')).trim(), f.get('password'), !!f.get('remember')); }
    catch (err) { box.innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; btn.textContent = 'Masuk'; if (err.net && $('#srvBox')) $('#srvBox').open = true; }
    return;
  }
  if (on === 'changePw') {
    const f = new FormData(form), box = $('#pwErr'), btn = $('button[type="submit"]', form);
    box.innerHTML = ''; btn.disabled = true;
    try { await call('changePassword', { oldPassword: f.get('oldPassword'), newPassword: f.get('newPassword') }); form.reset(); toast('Password diganti'); }
    catch (err) { box.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
    btn.disabled = false; return;
  }
  if (on === 'saveUser') { return submitForm(form, 'saveUser', FORMS.saveUser).then(() => { if (S.view === 'akun') loadUsers(); }); }
  if (FORMS[on]) submitForm(form, on, FORMS[on]);
});
document.addEventListener('input', e => {
  const t = e.target, on = t.dataset.on;
  if (on === 'kasQ') { S.kasF.q = t.value; const pos = t.selectionStart; renderView(); const n = $('#kq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
  if (on === 'fmtNum') { const v = parseNum(t.value); t.value = v ? nf.format(v) : ''; }
  const form = t.form;
  if (form && form.dataset.on === 'saveJual') { const f = new FormData(form); $('#f-total').textContent = rp(parseNum(f.get('kg')) * parseNum(f.get('harga'))); }
});
document.addEventListener('change', async e => {
  const t = e.target, on = t.dataset.on, form = t.form;
  if (on === 'kasBulan') { S.kasF.bulan = t.value; renderView(); return; }
  if (on === 'pickPhoto') {
    const files = [...t.files]; t.value = '';
    for (const f of files) { try { const data = await compress(f); S.form.photos.push({ kind: 'new', data, name: f.name.replace(/\.\w+$/, '') + '.jpg' }); } catch (err) { toast(err.message); } }
    renderPhotos(); return;
  }
  if (form && form.dataset.on === 'saveKas' && t.name === 'jenis') { $('#f-kat').innerHTML = katOptions(t.value); }
  if (form && form.dataset.on === 'saveProd' && t.name === 'keg') { $('#panenField').hidden = t.value !== 'Panen'; }
  if (form && form.dataset.on === 'saveMit' && (t.name === 'p' || t.name === 'd')) { const f = new FormData(form), s = f.get('p') * f.get('d'); $('#f-skor').textContent = s + ' · ' + lvl(s)[0]; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('Foto tidak bisa dibaca.'));
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => rej(new Error('Format foto tidak didukung. Gunakan JPG atau PNG.'));
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

boot();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
